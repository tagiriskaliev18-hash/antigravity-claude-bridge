<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council Engine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090B10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2300F5A0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2300D2FF'/%3E%3C/svg%3E">
<style>
/* Layout: Dark Precision HUD. Topology bar on top, three columns below (models | cognitive feed | live inspector),
   the command matrix floats over the bottom of the feed. Accents (lime, cyan, amber) mark state only;
   model families carry their own muted badge hues. Fallback: the v3 typefaces, also shipped in /fonts. */
/* Inter and JetBrains Mono ship with the app (SIL OFL), so the page makes no requests outside this computer. */
@font-face{font-family:"Inter";font-display:swap;font-weight:100 900;src:url(/fonts/inter-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Inter";font-display:swap;font-weight:100 900;src:url(/fonts/inter-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-display:swap;font-weight:100 800;src:url(/fonts/jetbrains-mono-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"JetBrains Mono";font-display:swap;font-weight:100 800;src:url(/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"CE Sans";font-display:swap;font-weight:100 900;src:url(/fonts/geologica-cyrillic-full-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"CE Sans";font-display:swap;font-weight:100 900;src:url(/fonts/geologica-latin-full-normal.woff2) format("woff2")}
@font-face{font-family:"CE Mono";font-display:swap;font-weight:100 800;src:url(/fonts/martian-mono-cyrillic-standard-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"CE Mono";font-display:swap;font-weight:100 800;src:url(/fonts/martian-mono-latin-standard-normal.woff2) format("woff2")}

:root{
  color-scheme:dark;
  --bg0:#090B10; --bg1:#0E131F; --bg2:#121A2A;
  --glass:rgba(16,22,36,.56); --glass-hi:rgba(24,32,50,.72); --glass-lo:rgba(12,16,26,.42);
  --line:rgba(255,255,255,.08); --line-hi:rgba(255,255,255,.16); --line-lo:rgba(255,255,255,.045);
  --ink:#E7ECF5; --ink2:#A3ADC2; --ink3:#69738A; --ink4:#465066;
  --lime:#00F5A0; --cyan:#00D2FF; --amber:#FFB340; --bad:#FF5C7A;
  --sans:"Inter","CE Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","CE Mono",ui-monospace,Consolas,monospace;
  --r-lg:16px; --r-md:11px; --r-sm:7px;
  --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:17px; --fs-xl:22px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg0);color:var(--ink);font:400 var(--fs-md)/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--cyan);outline-offset:2px;border-radius:6px}
::selection{background:rgba(0,210,255,.28)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);background-clip:padding-box}
.mono{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.dim{color:var(--ink2)}.faint{color:var(--ink3)}
[hidden]{display:none!important}

/* ---------- atmosphere */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1200px 700px at 72% -10%,rgba(0,210,255,.07),transparent 60%),
             radial-gradient(900px 600px at 8% 110%,rgba(0,245,160,.05),transparent 60%),
             linear-gradient(180deg,var(--bg0),var(--bg1))}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 50px -24px rgba(0,0,0,.7);position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0) 38%)}

/* ---------- shell */
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);gap:12px;padding:12px 14px 14px}
#main{display:grid;grid-template-columns:272px minmax(0,1fr) 300px;gap:12px;min-height:0}
#main.no-right{grid-template-columns:272px minmax(0,1fr)}
@media (max-width:1180px){#main,#main.no-right{grid-template-columns:240px minmax(0,1fr)} #right{display:none} #right.show{display:flex;position:fixed;right:14px;top:86px;bottom:14px;width:300px;z-index:30}}
@media (max-width:860px){#main,#main.no-right{grid-template-columns:minmax(0,1fr)} #left{display:none} #left.show{display:flex;position:fixed;left:14px;top:86px;bottom:14px;width:min(300px,calc(100% - 28px));z-index:30} .topo-chain{display:none!important}}

/* ---------- topology bar */
#topo{display:flex;align-items:center;gap:18px;padding:11px 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#121a2a,#0a0e17);border:1px solid var(--line-hi);position:relative}
.brand-mark i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--lime);box-shadow:0 0 12px rgba(0,245,160,.45)}
.brand-mark i::after{content:"";position:absolute;inset:0;margin:auto;width:4px;height:4px;border-radius:50%;background:var(--cyan)}
.brand b{display:block;font:600 15px/1.1 var(--sans);letter-spacing:-.01em}
.brand small{display:block;font:500 10.5px/1.2 var(--mono);color:var(--ink3);letter-spacing:.04em;margin-top:3px;white-space:nowrap}
#topo{min-width:0}
.brand{flex:none}
.topo-chain{flex:1 1 0;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;container-type:inline-size}
@container (max-width:700px){.tnode > span:last-child{display:none}.tnode{padding:5px 7px}.tlink{width:14px}}
@container (max-width:440px){.tfam:nth-child(n+6){display:none}}
#chair{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.06em}
.tnode{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 7px;border-radius:999px;border:1px solid var(--line);background:var(--glass-lo);
  font:500 12px/1 var(--sans);color:var(--ink2);white-space:nowrap;transition:border-color .3s,color .3s,box-shadow .3s}
.tnode svg{width:15px;height:15px;flex:none}
.tnode .pip{width:6px;height:6px;border-radius:50%;background:var(--ink4);flex:none;transition:background .3s,box-shadow .3s}
.tnode.on{color:var(--ink);border-color:rgba(0,245,160,.35)}
.tnode.on .pip{background:var(--lime);box-shadow:0 0 0 3px rgba(0,245,160,.12),0 0 10px rgba(0,245,160,.7)}
.tnode.busy{color:var(--ink);border-color:rgba(0,210,255,.45);box-shadow:0 0 18px -6px rgba(0,210,255,.6)}
.tnode.busy .pip{background:var(--cyan);animation:pulse 1.2s var(--ease) infinite}
.tnode.off{opacity:.55}
.tlink{width:26px;height:2px;flex:none;position:relative;overflow:hidden;border-radius:2px;background:var(--line)}
.tlink.flow::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:flow 1.1s linear infinite}
.tfams{display:flex;gap:4px;align-items:center;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--glass-lo)}
.tfam{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);position:relative;transition:color .3s,background .3s}
.tfam svg{width:14px;height:14px}
.tfam.has{color:var(--ink2)}
.tfam.busy{color:var(--fc);background:color-mix(in srgb,var(--fc) 16%,transparent);box-shadow:0 0 14px -2px color-mix(in srgb,var(--fc) 60%,transparent)}
.tfam.busy::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid var(--fc);opacity:.6;animation:ring 1.4s var(--ease) infinite}
.tfam.nokey{opacity:.35}
.meters{display:flex;align-items:center;gap:14px;margin-left:auto;flex:none}
.meters > *{flex:none}
.toggle{white-space:nowrap}
.meter{display:flex;flex-direction:column;gap:5px;min-width:0}
.meter .v{font:600 15px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.meter .v small{font-size:10.5px;color:var(--ink3);font-weight:500;margin-left:3px}
#spark{display:block;width:112px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);font:500 11.5px/1 var(--sans);color:var(--ink2);white-space:nowrap;background:var(--glass-lo)}
.chip .pip{width:6px;height:6px;border-radius:50%;background:var(--ink4)}
.chip.ok{border-color:rgba(0,245,160,.3);color:var(--ink)}.chip.ok .pip{background:var(--lime);box-shadow:0 0 8px rgba(0,245,160,.8)}
.chip.warn{border-color:rgba(255,179,64,.35);color:var(--ink)}.chip.warn .pip{background:var(--amber);box-shadow:0 0 8px rgba(255,179,64,.8)}
.chip.live{border-color:rgba(0,210,255,.38);color:var(--ink)}.chip.live .pip{background:var(--cyan);animation:pulse 1.2s infinite}
.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--glass-lo);display:grid;place-items:center;color:var(--ink2);transition:color .2s,border-color .2s,background .2s}
.iconbtn:hover{color:var(--ink);border-color:var(--line-hi);background:var(--glass-hi)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.on{color:var(--lime);border-color:rgba(0,245,160,.3)}
.sidebtn{display:none}
@media (max-width:1180px){.sidebtn.r{display:grid}}
@media (max-width:860px){.sidebtn.l{display:grid} .meters .meter.hide-s{display:none}}

/* ---------- side panels */
.panel{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.pbody{overflow:auto;padding:0 10px 12px;min-height:0;flex:1}
.sect{padding:4px 6px 12px}
.sect + .sect{border-top:1px solid var(--line-lo);padding-top:14px}
.sect .lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.sect .lbl > span:last-child{white-space:nowrap}

.pool{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:var(--r-md);border:1px solid transparent;background:none;text-align:left;width:100%;transition:background .2s,border-color .2s}
.pool:hover{background:var(--glass-hi);border-color:var(--line)}
.pool.sel{border-color:color-mix(in srgb,var(--fc) 45%,transparent);background:color-mix(in srgb,var(--fc) 8%,transparent)}
.plogo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--fc);background:color-mix(in srgb,var(--fc) 11%,transparent);border:1px solid color-mix(in srgb,var(--fc) 22%,transparent);position:relative}
.plogo svg{width:15px;height:15px}
.plogo.busy::after{content:"";position:absolute;inset:-3px;border-radius:10px;border:1px solid var(--fc);animation:ring 1.4s var(--ease) infinite}
.pool .t{font:500 13px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pool .s{font:400 10.5px/1.3 var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pool .r{text-align:right}
.pool .tok{font:500 11px/1 var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.kdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-top:6px}
.kdot.ok{background:var(--lime);box-shadow:0 0 6px rgba(0,245,160,.7)}
.kdot.no{background:var(--bad)}
.kdot.free{background:var(--ink3)}
.kdot.warn{background:var(--amber);box-shadow:0 0 6px rgba(255,179,64,.7)}

.member{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 6px;border-radius:9px}
.member .plogo{width:22px;height:22px;border-radius:6px}.member .plogo svg{width:12px;height:12px}
.member .t{font:500 12.5px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member .s{font:400 10.5px/1.25 var(--mono);color:var(--ink3)}
.state{font:500 10.5px/1 var(--mono);color:var(--ink3);white-space:nowrap}
.state.ok{color:var(--lime)}.state.run{color:var(--cyan)}.state.bad{color:var(--bad)}.state.warn{color:var(--amber)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 6px;border-radius:9px}
.call .t{font:500 12px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .s{font:400 10.5px/1.3 var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- feed */
#center{display:flex;flex-direction:column;min-height:0;position:relative;padding:0;overflow:hidden}
#feedhead{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;border-bottom:1px solid var(--line-lo)}
#feedhead h1{font:600 var(--fs-lg)/1.2 var(--sans);letter-spacing:-.015em;margin:0}
#feedhead .sub{color:var(--ink3);font-size:12px}
.seg{display:flex;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--glass-lo);margin-left:auto}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font:500 12px/1 var(--sans);color:var(--ink3)}
.seg button.on{background:var(--glass-hi);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
#feed{flex:1;overflow:auto;padding:22px 24px 210px;scroll-behavior:smooth}
.feed-in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.empty{margin:8vh auto 0;max-width:520px;text-align:center;color:var(--ink2)}
.empty h2{font:600 var(--fs-xl)/1.25 var(--sans);letter-spacing:-.02em;color:var(--ink);margin:16px 0 8px;text-wrap:balance}
.empty p{margin:0 auto;max-width:44ch;font-size:13.5px}
.orb{width:66px;height:66px;margin:0 auto;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,rgba(0,210,255,.35),rgba(0,245,160,.08) 55%,transparent 70%);border:1px solid var(--line-hi)}
.orb::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--lime);box-shadow:0 0 24px var(--lime);opacity:.85}

.turn{display:flex;flex-direction:column;gap:10px;animation:rise .45s var(--ease) both}
.ask{align-self:flex-end;max-width:min(78%,640px);padding:11px 15px;border-radius:14px 14px 4px 14px;background:linear-gradient(180deg,rgba(0,210,255,.11),rgba(0,210,255,.05));border:1px solid rgba(0,210,255,.2);white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.askmeta{align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;font:500 10.5px/1.2 var(--mono);color:var(--ink3);border:1px solid var(--line-lo);background:rgba(255,255,255,.02);white-space:nowrap}
.tag.hi{color:var(--amber);border-color:rgba(255,179,64,.28)}
.reply{padding:0;overflow:hidden}
.rhead{display:flex;align-items:center;gap:10px;padding:11px 14px 0 14px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;font:600 12px/1 var(--sans);color:var(--ink);
  background:color-mix(in srgb,var(--fc) 12%,transparent);border:1px solid color-mix(in srgb,var(--fc) 38%,transparent);box-shadow:0 0 16px -6px color-mix(in srgb,var(--fc) 75%,transparent)}
.src .plogo{width:20px;height:20px;border-radius:50%;border:0;background:color-mix(in srgb,var(--fc) 22%,transparent)}
.src .plogo svg{width:11px;height:11px}
.rmeta{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--ink3);font:500 11px/1 var(--mono);font-variant-numeric:tabular-nums}
.rbody{padding:10px 18px 16px;font-size:14px;line-height:1.62;word-wrap:break-word}
.rbody.err{color:#ffc3cf}
.live{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.liveline{display:flex;align-items:center;gap:10px;font-size:13.5px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,210,255,.18);border-top-color:var(--cyan);animation:spin .9s linear infinite;flex:none}
.council{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;border:1px solid rgba(255,179,64,.28);background:linear-gradient(180deg,rgba(255,179,64,.07),rgba(255,179,64,.02))}
.council .head{display:flex;align-items:center;gap:8px;font:600 12.5px/1.2 var(--sans);color:var(--amber)}
.council .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.cm{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.18);border:1px solid var(--line-lo)}
.cm .plogo{width:22px;height:22px;border-radius:6px}.cm .plogo svg{width:12px;height:12px}
.cm .t{font:500 12px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .s{font:400 10px/1.2 var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.reason{margin:0 14px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.22);overflow:hidden}
details.reason summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
details.reason summary::-webkit-details-marker{display:none}
details.reason summary .chev{width:12px;height:12px;transition:transform .25s var(--ease);color:var(--ink3)}
details.reason[open] summary .chev{transform:rotate(90deg)}
details.reason summary .cnt{margin-left:auto;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--ink3)}
.rsteps{padding:2px 12px 12px;font:400 11.5px/1.65 var(--mono);color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.rstep{display:grid;grid-template-columns:52px 14px minmax(0,1fr) auto;gap:8px;align-items:baseline}
.rstep .ok{color:var(--lime)}.rstep .bad{color:var(--bad)}.rstep .run{color:var(--cyan)}
.rstep .why{color:var(--ink3)}
.rusage{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 14px}

/* markdown */
.md h1,.md h2,.md h3,.md h4{font-family:var(--sans);letter-spacing:-.01em;margin:1.1em 0 .45em;line-height:1.3;text-wrap:balance}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:14.5px}.md h4{font-size:13.5px;color:var(--ink2)}
.md > :first-child{margin-top:0}.md > :last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md ul,.md ol{margin:.5em 0;padding-left:1.35em}.md li{margin:.2em 0}.md li::marker{color:var(--ink3)}
.md code{font-family:var(--mono);font-size:.86em;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--line-lo)}
.md pre{margin:.8em 0;padding:12px 14px;border-radius:10px;background:#070a10;border:1px solid var(--line);overflow:auto;position:relative}
.md pre code{padding:0;border:0;background:none;font-size:12px;line-height:1.6;white-space:pre}
.md pre .lang{position:absolute;top:6px;right:9px;font:500 10px/1 var(--mono);color:var(--ink4);text-transform:uppercase;letter-spacing:.1em}
.md blockquote{margin:.7em 0;padding:2px 0 2px 12px;border-left:2px solid var(--line-hi);color:var(--ink2)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md .tw{overflow-x:auto;margin:.8em 0}
.md table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.md th,.md td{border-bottom:1px solid var(--line-lo);padding:6px 10px;text-align:left;vertical-align:top}
.md th{font:600 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-bottom-color:var(--line)}
.md strong{color:#fff;font-weight:600}
.md a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(0,210,255,.35)}

/* ---------- command matrix */
#matrix{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(900px,calc(100% - 32px));padding:10px;border-radius:18px;
  background:rgba(14,19,31,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -20px rgba(0,0,0,.85),0 0 0 1px rgba(0,210,255,.05)}
#matrix.busy{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -20px rgba(0,0,0,.85),0 0 0 1px rgba(0,210,255,.25),0 0 40px -12px rgba(0,210,255,.4)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 9px}
.qa{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--glass-lo);font:500 12px/1 var(--sans);color:var(--ink2);transition:all .2s var(--ease)}
.qa:hover{color:var(--ink);border-color:var(--line-hi);transform:translateY(-1px)}
.qa .k{width:7px;height:7px;border-radius:2px;background:var(--qc)}
.qa.on{color:var(--ink);border-color:color-mix(in srgb,var(--qc) 55%,transparent);background:color-mix(in srgb,var(--qc) 10%,transparent)}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inbox{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line);background:rgba(5,8,13,.55);transition:border-color .2s,box-shadow .2s}
.inbox:focus-within{border-color:rgba(0,210,255,.4);box-shadow:0 0 0 3px rgba(0,210,255,.08)}
#q{display:block;width:100%;min-height:46px;max-height:220px;resize:none;border:0;outline:0;background:none;padding:12px 14px 4px;font-size:14px;line-height:1.5}
#q::placeholder{color:var(--ink3)}
.inbar{display:flex;align-items:center;gap:6px;padding:4px 8px 7px;flex-wrap:wrap}
.pick{position:relative}
.pickbtn{display:inline-flex;align-items:center;gap:6px;max-width:240px;padding:5px 9px 5px 6px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);font:500 11.5px/1 var(--sans);color:var(--ink2)}
.pickbtn:hover{color:var(--ink);border-color:var(--line-hi)}
.pickbtn .plogo{width:18px;height:18px;border-radius:5px}.pickbtn .plogo svg{width:10px;height:10px}
.pickbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn svg.caret{width:10px;height:10px;color:var(--ink3);flex:none}
.menu{position:absolute;bottom:calc(100% + 8px);left:0;z-index:40;width:300px;max-height:min(420px,60vh);overflow:auto;padding:6px;border-radius:12px;background:rgba(14,19,31,.97);border:1px solid var(--line-hi);box-shadow:0 24px 50px -10px rgba(0,0,0,.8);animation:pop .16s var(--ease)}
.menu .mh{padding:8px 8px 6px}
.mi{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;width:100%;padding:7px 8px;border:0;background:none;border-radius:8px;text-align:left}
.mi:hover,.mi.on{background:var(--glass-hi)}
.mi .plogo{width:22px;height:22px;border-radius:6px}.mi .plogo svg{width:12px;height:12px}
.mi .t{font:500 12.5px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .s{font:400 10.5px/1.25 var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;border:1px solid transparent;background:none;font:500 11.5px/1 var(--sans);color:var(--ink3)}
.toggle:hover{color:var(--ink2)}
.toggle .box{width:22px;height:13px;border-radius:9px;background:rgba(255,255,255,.08);position:relative;transition:background .2s}
.toggle .box::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--ink3);transition:transform .2s var(--ease),background .2s}
.toggle.on{color:var(--ink)}.toggle.on .box{background:rgba(0,245,160,.25)}.toggle.on .box::after{transform:translateX(9px);background:var(--lime)}
.hint{margin-left:auto;font:400 10.5px/1 var(--mono);color:var(--ink4);white-space:nowrap}
#send{height:46px;min-width:46px;padding:0 16px;border-radius:12px;border:0;font:600 13px/1 var(--sans);color:#06110c;
  background:linear-gradient(180deg,#38ffbd,var(--lime));box-shadow:0 8px 24px -8px rgba(0,245,160,.6),inset 0 1px 0 rgba(255,255,255,.5);display:flex;align-items:center;gap:8px;transition:transform .15s var(--ease),filter .2s}
#send:hover{filter:brightness(1.06);transform:translateY(-1px)}
#send:active{transform:translateY(1px)}
#send:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed;transform:none}
#send svg{width:15px;height:15px}
#stop{height:46px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,92,122,.35);background:rgba(255,92,122,.08);color:#ffb3c1;font:600 12.5px/1 var(--sans)}

#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;padding:10px 14px;border-radius:11px;font-size:13px;background:rgba(14,19,31,.96);border:1px solid var(--line-hi);box-shadow:0 18px 40px -12px rgba(0,0,0,.8);animation:pop .2s var(--ease);max-width:min(560px,90vw)}
.toast.bad{border-color:rgba(255,92,122,.45)}
.toast.ok{border-color:rgba(0,245,160,.4)}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,210,255,.55)}60%{box-shadow:0 0 0 6px rgba(0,210,255,0)}}
@keyframes ring{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.25);opacity:0}}
@keyframes flow{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
@keyframes pop{from{transform:translateY(4px) scale(.98)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}#feed{scroll-behavior:auto}}

<script>
"use strict";
// ================================================================ helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowS = () => Date.now() / 1000;
const store = {
  get(k, d){ try { const v = localStorage.getItem("ce4-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("ce4-" + k, JSON.stringify(v)); } catch (e) {} }
};
const fmtN = n => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".", ",") + " M" : n >= 1e4 ? Math.round(n / 1e3) + " K" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".", ",") + " K" : String(Math.round(n));
const fmtS = s => s == null ? "—" : s < 60 ? Math.round(s) + " с" : Math.floor(s / 60) + " мин " + String(Math.round(s % 60)).padStart(2, "0") + " с";
const fmtMs = ms => ms == null ? "—" : fmtS(ms / 1000);
const fmtT = ts => { if (!ts) return "—"; const d = new Date(ts * 1000), t = d.toTimeString().slice(0, 5);
  return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"}) + " " + t; };
const base = p => String(p || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop();

// ================================================================ model families
const FAM = {
  claude:  {n:"Claude",   c:"#F0A060", rx:/claude|sonnet|opus|haiku|fable|anthropic/i, logo:"claude"},
  deepseek:{n:"DeepSeek", c:"#5B86FF", rx:/deepseek/i, logo:"deepseek"},
  qwen:    {n:"Qwen",     c:"#2EE6A6", rx:/qwen|qwq/i, logo:"qwen"},
  gpt:     {n:"GPT",      c:"#8FD9CF", rx:/gpt|openai|octava_gpt|\bo[134]\b/i, logo:"gpt"},
  glm:     {n:"GLM",      c:"#9A8CFF", rx:/glm|zhipu|z\.ai/i, logo:"glm"},
  minimax: {n:"MiniMax",  c:"#FF7DB5", rx:/minimax|abab/i, logo:"minimax"},
  kimi:    {n:"Kimi",     c:"#E6E0C2", rx:/kimi|moonshot/i, logo:"kimi"},
  grok:    {n:"Grok",     c:"#C6CFDA", rx:/grok|x-?ai|tokenwave/i, logo:"grok"},
  gemini:  {n:"Gemini",   c:"#6FA8FF", rx:/gemini/i, logo:"gemini"},
  llama:   {n:"Llama",    c:"#B992FF", rx:/llama|groq/i, logo:"llama"},
  other:   {n:"Модель",   c:"#7C879B", rx:/$^/, logo:null},
};
const FAM_ORDER = ["claude","deepseek","gpt","qwen","glm","minimax","kimi","grok","gemini","llama","other"];
const famOf = (...xs) => { const s = xs.filter(Boolean).join(" "); for (const k of FAM_ORDER) if (FAM[k].rx.test(s)) return k; return "other"; };
function logo(key, fallback){
  const L = window.CE_LOGOS && window.CE_LOGOS[key];
  if (!L) return `<svg viewBox="0 0 24 24"><text x="12" y="16.5" text-anchor="middle" font-size="12" font-family="var(--mono)" fill="currentColor">${esc((fallback || "?").slice(0, 1).toUpperCase())}</text></svg>`;
  return `<svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true">${L.d.map(d => `<path d="${d}"/>`).join("")}</svg>`;
}
const famLogo = (f, cls = "plogo", extra = "") => `<span class="${cls}${extra}" style="--fc:${FAM[f].c}">${logo(FAM[f].logo, FAM[f].n)}</span>`;

// ================================================================ state
const S = {
  cfg: null, st: null, projects: [], lastOk: 0,
  target: store.get("target", {mode:"auto"}),       // {mode, agent?, provider?}
  folder: store.get("folder", ""), follow: false,
  feed: store.get("feed", "chat"), sound: store.get("sound", true),
  seenDone: new Set(), seenCouncil: new Set(), sending: false, menu: null, firstLoad: true,
};

// ================================================================ data access
const files = () => { const o = {}; for (const f of S.st?.system?.files || []) o[f.name] = f.data || {}; return o; };
function pools(){
  const pv = files()["providers.json"]?.providers || {}, keys = S.st?.system?.keys || {};
  const byProv = S.st?.activity?.tokens?.by_provider || {}, acc = files()["providers.json"]?.accounts || {};
  const health = poolHealth();
  return Object.entries(pv).map(([id, p]) => {
    const env = p.api_key_env, hasKey = !env ? (p.type === "cli" ? "cli" : "free") : keys[env] ? "ok" : "no";
    return {id, p, fam: famOf(p.model, id), model: p.model || p.command || "", account: acc[p.account]?.title || p.account || (p.type === "cli" ? "Claude Code CLI" : ""),
      key: hasKey, tok: byProv[id]?.total || 0, health: health[id] || null};
  });
}
function poolHealth(){
  const out = {};
  for (const c of (S.st?.activity?.calls || []).slice().sort((a, b) => a.start - b.start))
    for (const r of c.route || []) if (r.provider && r.ok != null) out[r.provider] = {ok: r.ok, why: r.why, ts: r.done || r.ts};
  return out;
}
function agents(){ return files()["agents.json"] || {}; }
function poolById(id){ return pools().find(p => p.id === id); }
function callById(id){ return (S.st?.activity?.calls || []).find(c => c.id === id); }
function runningRoute(call){
  if (!call) return [];
  return (call.route || []).filter(r => r.ok == null && !r.done && !call.end);
}
function famOfProvider(pid, model){ const p = poolById(pid); return famOf(model, p?.model, pid); }

// ================================================================ sound & haptics
const Snd = (() => {
  let ctx = null;
  const ac = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; };
  function tone(freq, t0, dur, type = "sine", gain = .05, slide){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + t0 + dur);
    f.type = "lowpass"; f.frequency.value = 2600;
    g.gain.setValueAtTime(0, c.currentTime + t0);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + t0 + dur);
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  return {
    unlock: ac,
    tick(){ if (!S.sound) return; tone(1400, 0, .035, "sine", .025); buzz(6); },
    send(){ if (!S.sound) return; tone(520, 0, .12, "sine", .05, 880); tone(1320, .06, .08, "triangle", .018); buzz(12); },
    done(){ if (!S.sound) return; tone(784, 0, .22, "sine", .045); tone(1175, .09, .3, "sine", .035); buzz([8, 40, 8]); },
    council(){ if (!S.sound) return; [523, 659, 784].forEach((f, i) => tone(f, i * .07, .5, "sine", .03)); buzz([10, 30, 10, 30, 10]); },
    error(){ if (!S.sound) return; tone(220, 0, .18, "square", .025, 150); tone(180, .12, .22, "square", .02, 120); buzz([30, 40, 30]); },
  };
})();

// ================================================================ background: dot grid with slow drifting motes
(function bg(){
  const cv = $("#bg"), g = cv.getContext("2d"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, motes = [], raf = 0;
  function size(){
    dpr = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
    motes = Array.from({length: Math.round(w * h / 42000)}, () => ({x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .3,
      vx: (Math.random() - .5) * .06, vy: -Math.random() * .08 - .02, a: Math.random() * .5 + .15, hue: Math.random() < .5 ? "0,245,160" : "0,210,255"}));
    draw(0);
  }
  function draw(t){
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const step = 26; g.fillStyle = "rgba(255,255,255,.045)";
    for (let y = 13; y < h; y += step) for (let x = 13; x < w; x += step) g.fillRect(x, y, 1, 1);
    for (const m of motes){
      if (!reduce){ m.x += m.vx; m.y += m.vy; if (m.y < -5) { m.y = h + 5; m.x = Math.random() * w; } if (m.x < -5) m.x = w + 5; if (m.x > w + 5) m.x = -5; }
      const a = m.a * (.6 + .4 * Math.sin(t / 1400 + m.x));
      g.beginPath(); g.fillStyle = `rgba(${m.hue},${a.toFixed(3)})`; g.arc(m.x, m.y, m.r, 0, 6.283); g.fill();
    }
    if (!reduce && !document.hidden) raf = requestAnimationFrame(draw);
  }
  addEventListener("resize", () => { cancelAnimationFrame(raf); size(); });
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden && !reduce) raf = requestAnimationFrame(draw); });
  size();
})();

// ================================================================ network
async function getJSON(u){ const r = await fetch(u, {cache: "no-store"}); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function postJSON(u, body){
  const r = await fetch(u, {method: "POST", headers: {"Content-Type": "application/json", "X-Council": "1"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
function toast(msg, kind = ""){
  const el = document.createElement("div"); el.className = "toast " + kind; el.textContent = msg;
  $("#toast").appendChild(el); setTimeout(() => { el.style.transition = "opacity .4s"; el.style.opacity = 0; setTimeout(() => el.remove(), 400); }, kind === "bad" ? 6500 : 3500);
}

// ================================================================ markdown (escape first, then a small safe subset)
function md(src){
  src = String(src || "").replace(/\r\n?/g, "\n");
  const blocks = [], out = [];
  src = src.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (_, lang, code) => { blocks.push(`<pre>${lang ? `<span class="lang">${esc(lang)}</span>` : ""}<code>${esc(code.replace(/\n$/, ""))}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  const lines = src.split("\n");
  for (let i = 0; i < lines.length; i++){
    const l = lines[i];
    const ph = l.match(/^\u0000(\d+)\u0000$/); if (ph){ out.push(blocks[+ph[1]]); continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){ out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push("<hr>"); continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])){
      const row = s => s.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++])); i--;
      out.push(`<div class="tw"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
      i--; out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^>\s?/.test(l)){ const q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, "")); i--; out.push(`<blockquote>${inline(q.join(" "))}</blockquote>`); continue; }
    if (!l.trim()){ out.push(""); continue; }
    const para = [l]; while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#{1,4}\s|\s*([-*+]|\d+[.)])\s|>|\u0000|\s*\|)/.test(lines[i + 1])) para.push(lines[++i]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}

function drawSpark(hist){
  const cv = $("#spark"), g = cv.getContext("2d"), W = cv.width, H = cv.height, bins = new Array(24).fill(0), t0 = Date.now() - 24 * 3600e3;
  for (const h of hist){ const t = Date.parse(String(h.timestamp || "").replace(" ", "T")); if (t >= t0) bins[Math.min(23, Math.floor((t - t0) / 3600e3))] += h.total_tokens || 0; }
  const max = Math.max(1, ...bins), bw = W / 24;
  g.clearRect(0, 0, W, H);
  g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(0, H - 1, W, 1);
  bins.forEach((v, i) => {
    if (!v) return; const bh = Math.max(3, (v / max) * (H - 6));
    const grad = g.createLinearGradient(0, H - bh, 0, H); grad.addColorStop(0, i === 23 ? "#00F5A0" : "rgba(0,210,255,.85)"); grad.addColorStop(1, "rgba(0,210,255,.15)");
    g.fillStyle = grad; const x = i * bw + 2, w = bw - 4, y = H - bh, r = Math.min(3, w / 2);
    g.beginPath(); g.moveTo(x, H); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, H); g.fill();
  });
  cv.title = "Токены по часам за последние сутки. Пик: " + fmtN(max === 1 ? 0 : max);
}

function jobSource(job, call){

  if (job.provider){ const p = poolById(job.provider); return {fam: p?.fam || famOf(job.provider), label: p?.model || job.provider}; }
  if (job.agent){ const A = agents().agents?.[job.agent]; const p = poolById(A?.primary_provider); return {fam: p?.fam || "other", label: roleName(job.agent)}; }

const roleName = id => (agents().agents?.[id]?.name || id || "").replace(/\s*\(.*\)$/, "");

  const call = callById(job.call), src = jobSource(job, call), m = MODE[job.mode] || MODE.auto;
  const meta = [`<span class="tag" style="color:${m.c};border-color:${m.c}40">${esc(m.n)}${job.agent ? " · " + esc(roleName(job.agent)) : ""}${job.provider ? " · " + esc(job.provider) : ""}</span>`,
    job.folder ? `<span class="tag" title="${esc(job.folder)}">⌂ ${esc(base(job.folder))}</span>` : "", job.follow ? '<span class="tag">с контекстом</span>' : "", `<span class="tag">${fmtT(job.ts)}</span>`].join("");
  let reply;
  if (job.status === "running") reply = `<div class="reply glass">${liveBlock(job, call)}</div>`;
  else {
    const err = job.status === "error";
    reply = `<div class="reply glass"><div class="rhead"><span class="src" style="--fc:${err ? "#FF5C7A" : FAM[src.fam].c}">${famLogo(err ? "other" : src.fam)}${esc(err ? "Ошибка" : src.label)}</span>
      <span class="rmeta"><span>${fmtMs(job.ms)}</span>${call?.chars ? `<span>${fmtN(call.chars)} симв.</span>` : ""}<button class="iconbtn" data-copy="${esc(job.id)}" title="Скопировать ответ" style="width:26px;height:26px;border-radius:7px"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="8.5" height="8.5" rx="2"/><path d="M3 10.5V4a1.5 1.5 0 0 1 1.5-1.5H11"/></svg></button></span></div>
      <div class="rbody md ${err ? "err" : ""}">${md(job.answer || "")}</div>${reasonBlock(job, call)}</div>`;
  }
  const div = document.createElement("div"); div.className = "turn"; div.dataset.id = job.id;
  div.innerHTML = `<div class="askmeta">${meta}</div><div class="ask">${esc(job.text)}</div>${reply}`;
  return div;
}
function extCallEl(c){
  const last = (c.route || []).filter(r => r.ok).slice(-1)[0], f = famOf(last?.model, c.model, last?.provider, c.provider);
  const who = {antigravity: "Antigravity", "claude-code": "Claude Code", "council-engine": "Чат"}[c.client] || c.client || "";
  const q = c.args && (c.args.task || c.args.question || c.args.prompt || c.args.code || "");
  const div = document.createElement("div"); div.className = "turn"; div.dataset.id = "c" + c.id;
  div.innerHTML = `<div class="askmeta"><span class="tag">${esc(who)}</span><span class="tag">${esc(c.tool)}</span>${c.consilium ? '<span class="tag hi">консилиум</span>' : ""}<span class="tag">${fmtT(c.start)}</span></div>
    ${q ? `<div class="ask">${esc(String(q).slice(0, 600))}${String(q).length > 600 ? "…" : ""}</div>` : ""}
    <div class="reply glass">${!c.end ? `<div class="live"><div class="liveline"><span class="spinner"></span>Выполняется · ${fmtS(nowS() - c.start)}</div></div>` :
      `<div class="rhead"><span class="src" style="--fc:${c.error ? "#FF5C7A" : FAM[f].c}">${famLogo(c.error ? "other" : f)}${esc(c.error ? "Ошибка" : (last?.model || c.model || c.provider || c.tool))}</span><span class="rmeta"><span>${fmtMs(c.ms)}</span>${c.chars ? `<span>${fmtN(c.chars)} симв.</span>` : ""}</span></div>
       <div class="rbody md">${md(c.preview || "")}${c.chars > 400 ? '<p class="faint mono">Полный ответ — у вызвавшего клиента; журнал хранит первые 400 символов.</p>' : ""}</div>${reasonBlock({ts: c.start, mode: c.consilium ? "consilium" : "auto"}, c)}`}</div>`;
  return div;
}
const elCache = new Map();
function renderFeed(){
  const feedIn = $("#feedIn"), feed = $("#feed");
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
  const jobs = (S.st?.chat?.jobs || []).slice().sort((a, b) => a.ts - b.ts);
  let items = jobs.map(j => ({key: j.id, ts: j.ts, sig: () => jobSig(j), make: () => jobEl(j)}));
  if (S.feed === "all"){
    const mine = new Set(jobs.map(j => j.call).filter(Boolean));
    const ext = (S.st?.activity?.calls || []).filter(c => !mine.has(c.id));
    items = items.concat(ext.map(c => ({key: "c" + c.id, ts: c.start, sig: () => [c.id, c.end ? 1 : 0, (c.route || []).length, c.error].join("|") + (c.end ? "" : Math.floor(nowS() / 1)), make: () => extCallEl(c)})));
    items.sort((a, b) => a.ts - b.ts);
  }
  $("#feedsub").textContent = S.feed === "all" ? "Чат и вызовы моста из Antigravity и Claude Code" : `Задачи моделям, ролям и консилиуму · ${jobs.length} в истории`;
  if (!items.length){
    feedIn.innerHTML = `<div class="empty"><div class="orb"></div><h2>Пульт готов к первой задаче</h2><p>Выберите режим внизу: быстрый черновик, аудит кода или архитектурный консилиум. Ответ придёт сюда вместе с цепочкой моделей, которые над ним работали.</p></div>`;
    elCache.clear(); return;
  }
  if (feedIn.querySelector(".empty")) feedIn.innerHTML = "";
  const keep = new Set();
  let prev = null;
  for (const it of items){
    keep.add(it.key);
    const sig = it.sig(), cached = elCache.get(it.key);
    let el;
    if (cached && cached.sig === sig) el = cached.el;
    else {
      el = it.make();
      if (cached){ const open = cached.el.querySelector("details.reason[open]"); if (open) el.querySelector("details.reason")?.setAttribute("open", ""); el.style.animation = "none"; cached.el.replaceWith(el); }
      elCache.set(it.key, {sig, el});
    }
    if (prev ? prev.nextSibling !== el : feedIn.firstChild !== el) (prev ? prev.after(el) : feedIn.prepend(el));
    prev = el;
  }
  for (const [k, v] of elCache) if (!keep.has(k)){ v.el.remove(); elCache.delete(k); }
  if (nearBottom || S.firstLoad) feed.scrollTop = feed.scrollHeight;
}
function liveTimers(){
  // running cards carry elapsed time; refresh them every second without a full state round trip
  for (const j of (S.st?.chat?.jobs || []).filter(j => j.status === "running")){
    const c = elCache.get(j.id); if (!c) continue;
    const m = c.el.querySelector(".rmeta span, .council .head");
    if (m && m.classList.contains("head")) m.lastChild.textContent = "Созван консилиум · " + fmtS(nowS() - j.ts);
    else if (m) m.textContent = fmtS(nowS() - j.ts);
  }
}

// ================================================================ events from state changes: sounds, toasts
function diffEvents(){
  const jobs = S.st?.chat?.jobs || [];
  for (const j of jobs){
    if (j.status !== "running" && !S.seenDone.has(j.id)){
      S.seenDone.add(j.id);
      if (!S.firstLoad){ if (j.status === "error"){ Snd.error(); toast("Запрос завершился ошибкой: " + String(j.answer || "").slice(0, 160), "bad"); } else { Snd.done(); toast(`Готово за ${fmtMs(j.ms)}`, "ok"); } }
    }
  }
  for (const c of S.st?.activity?.calls || []){
    if (c.consilium && !c.end && !S.seenCouncil.has(c.id)){
      S.seenCouncil.add(c.id);
      if (!S.firstLoad){ Snd.council(); toast("Созван консилиум: участники отвечают одновременно", ""); }
    }
  }
}

// ================================================================ command matrix
const QUICK = [
  {id:"arch",  n:"Архитектурный консилиум", c:"#FFB340", t:{mode:"consilium"}, ph:"Опишите архитектурное решение, которое нужно обсудить консилиуму…"},
  {id:"audit", n:"Экспертный аудит кода",   c:"#9A8CFF", t:{mode:"role", agent:"security_auditor"}, ph:"Что проверить? Укажите папку проекта и файлы — аудитор найдёт уязвимости и ошибки…"},
  {id:"draft", n:"Экономный черновик",      c:"#00F5A0", t:{mode:"role", agent:"fast_developer"}, ph:"Что набросать? Черновик сделают быстрые дешёвые модели…"},
  {id:"auto",  n:"Авто-маршрут",            c:"#00D2FF", t:{mode:"auto"}, ph:"Опишите задачу — мост сам выберет модель…"},
];
function sameTarget(a, b){ return a.mode === b.mode && (a.agent || "") === (b.agent || "") && (a.provider || "") === (b.provider || ""); }
function renderMatrix(){
  $("#quick").innerHTML = QUICK.map(q => `<button class="qa ${sameTarget(q.t, S.target) ? "on" : ""}" data-quick="${q.id}" style="--qc:${q.c}"><span class="k"></span>${esc(q.n)}</button>`).join("");
  const t = S.target, A = agents().agents || {};
  let f = "other", label = MODE[t.mode]?.n || "Авто";
  if (t.mode === "model"){ const p = poolById(t.provider); f = p?.fam || "other"; label = p ? p.model : (t.provider || "Модель"); }
  else if (t.mode === "role"){ const p = poolById(A[t.agent]?.primary_provider); f = p?.fam || "other"; label = roleName(t.agent) || "Роль"; }
  else if (t.mode === "consilium"){ f = "claude"; label = "Консилиум"; }
  else if (t.mode === "claude"){ f = "claude"; label = "Claude Code"; }
  const autoIcon = t.mode === "auto" ? `<span class="plogo" style="--fc:var(--cyan)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/><circle cx="8" cy="8" r="2.5"/></svg></span>` : famLogo(f);
  $("#pickTarget").innerHTML = `<button class="pickbtn" id="btnTarget" aria-haspopup="menu" style="--fc:${FAM[f].c}">${autoIcon}<span>${esc(label)}</span><svg class="caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m2.5 6.5 2.5-3 2.5 3"/></svg></button>${S.menu === "target" ? targetMenu() : ""}`;
  const fl = S.folder ? base(S.folder) : "Без папки проекта";
  $("#pickFolder").innerHTML = `<button class="pickbtn" id="btnFolder" aria-haspopup="menu" title="${esc(S.folder || "Модели не видят файлы проекта")}"><span class="plogo" style="--fc:#A3ADC2"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.8 4.5A1.5 1.5 0 0 1 3.3 3h2.9l1.5 1.6h5a1.5 1.5 0 0 1 1.5 1.5v5.4a1.5 1.5 0 0 1-1.5 1.5H3.3a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span><span>${esc(fl)}</span><svg class="caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m2.5 6.5 2.5-3 2.5 3"/></svg></button>${S.menu === "folder" ? folderMenu() : ""}`;
  $("#tFollow").classList.toggle("on", S.follow);
  const q = QUICK.find(q => sameTarget(q.t, S.target));
  $("#q").placeholder = q ? q.ph : t.mode === "model" ? `Вопрос напрямую модели ${label}…` : t.mode === "claude" ? "Задача для Claude Code в папке проекта…" : t.mode === "role" ? `Задача для роли «${label}»…` : "Опишите задачу. Enter — отправить, Shift+Enter — новая строка";
  $("#hint").textContent = MODE[t.mode]?.d || "";
  renderBusy();
}
function renderBusy(){
  const busy = (S.st?.chat?.jobs || []).some(j => j.status === "running");
  $("#matrix").classList.toggle("busy", busy);
  $("#stop").hidden = !busy;
  $("#send").disabled = S.sending;
}
function targetMenu(){
  const A = agents(), ps = pools().filter(p => p.key !== "no");
  const item = (attrs, f, t, s, on, icon) => `<button class="mi ${on ? "on" : ""}" ${attrs} style="--fc:${f ? FAM[f].c : "var(--cyan)"}">${icon || famLogo(f)}<span style="min-width:0"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></span>${on ? '<span class="state ok">●</span>' : "<span></span>"}</button>`;
  const T = S.target;
  let h = `<div class="menu" role="menu"><div class="mh lbl">Режим</div>`;
  h += item('data-t="auto"', null, "Авто-маршрут", "мост выбирает модель сам", T.mode === "auto", `<span class="plogo" style="--fc:var(--cyan)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/><circle cx="8" cy="8" r="2.5"/></svg></span>`);
  h += item('data-t="consilium"', "claude", "Консилиум", `${(A.consilium?.members || []).length} участников + председатель`, T.mode === "consilium");
  h += item('data-t="claude"', "claude", "Claude Code", "CLI в папке проекта · тратит подписку", T.mode === "claude");
  h += `<div class="mh lbl">Модель напрямую</div>`;
  h += ps.map(p => item(`data-t="model" data-v="${esc(p.id)}"`, p.fam, p.model, `${p.id} · ${p.account}`, T.mode === "model" && T.provider === p.id)).join("");
  h += `<div class="mh lbl">Роль</div>`;
  h += Object.entries(A.agents || {}).map(([id, a]) => { const p = poolById(a.primary_provider); return item(`data-t="role" data-v="${esc(id)}"`, p?.fam || "other", roleName(id), `${p?.model || a.primary_provider} → ${(a.fallback_providers || []).length} запасных`, T.mode === "role" && T.agent === id); }).join("");
  return h + "</div>";
}
function folderMenu(){
  const item = (path, t, s, on) => `<button class="mi ${on ? "on" : ""}" data-folder="${esc(path)}" style="--fc:#A3ADC2"><span class="plogo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.8 4.5A1.5 1.5 0 0 1 3.3 3h2.9l1.5 1.6h5a1.5 1.5 0 0 1 1.5 1.5v5.4a1.5 1.5 0 0 1-1.5 1.5H3.3a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span><span style="min-width:0"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></span>${on ? '<span class="state ok">●</span>' : "<span></span>"}</button>`;
  return `<div class="menu" role="menu"><div class="mh lbl">Папка проекта</div>${item("", "Без папки", "модели получат только текст задачи", !S.folder)}${S.projects.map(p => item(p.path, p.name, `${p.source.join(", ")}${p.git ? " · git" : ""} · ${p.path}`, S.folder === p.path)).join("")}</div>`;
}
function setTarget(t){ S.target = t; store.set("target", t); S.menu = null; Snd.tick(); renderMatrix(); renderPools(); $("#q").focus(); }

async function send(){
  const text = $("#q").value.trim();
  if (!text || S.sending) return;
  const t = S.target;
  if (t.mode === "claude" && !S.folder){ toast("Для Claude Code выберите папку проекта.", "bad"); Snd.error(); S.menu = "folder"; renderMatrix(); return; }
  if (t.mode === "model" && !t.provider){ toast("Выберите модель.", "bad"); return; }
  S.sending = true; renderMatrix(); Snd.send();
  try {
    await postJSON("/api/chat", {mode: t.mode, agent: t.agent || "", provider: t.provider || "", folder: S.folder || "", text, follow: S.follow});
    $("#q").value = ""; autosize(); S.follow = false;
    await poll(true);
    const feed = $("#feed"); feed.scrollTop = feed.scrollHeight;
  } catch (e){ Snd.error(); toast("Не отправилось: " + e.message, "bad"); }
  finally { S.sending = false; renderMatrix(); }
}
function autosize(){ const q = $("#q"); q.style.height = "auto"; q.style.height = Math.min(220, q.scrollHeight) + "px"; }

// ================================================================ wiring
document.addEventListener("click", async e => {
  Snd.unlock();
  const b = e.target.closest("button, a"); if (!b) { if (S.menu){ S.menu = null; renderMatrix(); } return; }
  if (b.id === "btnTarget"){ S.menu = S.menu === "target" ? null : "target"; Snd.tick(); renderMatrix(); return; }
  if (b.id === "btnFolder"){ S.menu = S.menu === "folder" ? null : "folder"; Snd.tick(); renderMatrix(); if (!S.projects.length) loadProjects(); return; }
  if (b.dataset.t){ const m = b.dataset.t, v = b.dataset.v; return setTarget(m === "model" ? {mode: m, provider: v} : m === "role" ? {mode: m, agent: v} : {mode: m}); }
  if (b.dataset.folder != null){ S.folder = b.dataset.folder; store.set("folder", S.folder); S.menu = null; Snd.tick(); renderMatrix(); return; }
  if (b.dataset.quick){ const q = QUICK.find(x => x.id === b.dataset.quick); return setTarget({...q.t}); }
  if (b.dataset.pool){ const p = poolById(b.dataset.pool); if (p?.key === "no"){ toast(`У пула ${p.id} нет ключа: впишите ${p.p.api_key_env} в C:\\projects\\tools\\.env`, "bad"); Snd.error(); return; } return setTarget({mode: "model", provider: b.dataset.pool}); }
  if (b.dataset.copy){ const j = (S.st?.chat?.jobs || []).find(x => x.id === b.dataset.copy); try { await navigator.clipboard.writeText(j?.answer || ""); toast("Ответ скопирован", "ok"); Snd.tick(); } catch (err) { toast("Не удалось скопировать", "bad"); } return; }
  if (b.id === "tFollow"){ S.follow = !S.follow; Snd.tick(); renderMatrix(); return; }
  if (b.id === "send") return send();
  if (b.id === "stop"){ try { await postJSON("/api/chat/stop", {}); toast("Мост чата остановлен. Запущенные запросы завершатся ошибкой."); Snd.tick(); poll(true); } catch (err) { toast(err.message, "bad"); } return; }
  if (b.id === "btnSound"){ S.sound = !S.sound; store.set("sound", S.sound); renderSoundBtn(); if (S.sound) Snd.done(); return; }
  if (b.id === "fChat" || b.id === "fAll"){ S.feed = b.id === "fAll" ? "all" : "chat"; store.set("feed", S.feed); $("#fChat").classList.toggle("on", S.feed === "chat"); $("#fAll").classList.toggle("on", S.feed === "all"); Snd.tick(); renderFeed(); return; }
  if (b.id === "btnLeft"){ $("#left").classList.toggle("show"); $("#right").classList.remove("show"); return; }
  if (b.id === "btnRight"){ $("#right").classList.toggle("show"); $("#left").classList.remove("show"); return; }
});
$("#q").addEventListener("input", autosize);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.menu){ S.menu = null; renderMatrix(); }
  if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
});
function renderSoundBtn(){
  const b = $("#btnSound"); b.classList.toggle("on", S.sound); b.title = S.sound ? "Звук и вибрация включены" : "Звук выключен";
  b.innerHTML = S.sound ? `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.6a6 6 0 0 1 0 8.8"/></svg>`
    : `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path d="m11 6 3.5 4M14.5 6 11 10"/></svg>`;
}
$("#fChat").classList.toggle("on", S.feed === "chat"); $("#fAll").classList.toggle("on", S.feed === "all");

// ================================================================ loop
async function loadConfig(force){ try { S.cfg = await getJSON("/api/config" + (force ? "?refresh=1" : "")); } catch (e) {} }
async function loadProjects(){ try { S.projects = (await getJSON("/api/projects")).projects || []; if (S.menu === "folder") renderMatrix(); } catch (e) {} }
let polling = false, offline = false;
async function poll(force){
  if (polling && !force) return; polling = true;
  try {
    S.st = await getJSON("/api/state");
    if (offline){ offline = false; toast("Связь с Council Engine восстановлена", "ok"); }
    diffEvents(); renderTopo(); renderPools(); renderInspector(); renderFeed();
    if (S.menu) renderBusy(); else renderMatrix();   // an open menu is not rebuilt under the pointer
    S.firstLoad = false;
  } catch (e){
    if (!offline){ offline = true; toast("Council Engine не отвечает. Окно переподключится само.", "bad"); }
  } finally { polling = false; }
}
function schedule(){
  const busy = (S.st?.chat?.jobs || []).some(j => j.status === "running") || (S.st?.activity?.calls || []).some(c => !c.end);
  setTimeout(async () => { if (!document.hidden) await poll(); schedule(); }, busy ? 1000 : 2500);
}
renderSoundBtn(); renderMatrix();
(async () => { await loadConfig(false); await poll(true); schedule(); loadProjects(); setInterval(() => loadConfig(false), 60000); setInterval(() => { liveTimers(); $("#clock").textContent = new Date().toTimeString().slice(0, 8); }, 1000); })();
</script>
