<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council Engine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2304050d%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23ff2bd6%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%2319f3ff%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Unbounded:wght@500;700&family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Council Engine 2. Night-city operator console: rail | stage | dossier, live ticker at the bottom.
   One deliberate dark look; every number on screen comes from this computer (see "Справка"). */
:root{
  --void:#04050d; --bg2:#070a1a; --panel:rgba(9,13,30,.86); --panel2:#0d1430; --line:#1a2448; --line2:#2b3a78;
  --fg:#e6ecff; --dim:#8d98c6; --faint:#4f5a88;
  --cyan:#19f3ff; --pink:#ff2bd6; --yellow:#fcee0a; --red:#ff3b5c; --ok:#3dffa8; --warn:#ffb547;
  --brand:"Orbitron","Unbounded","Bahnschrift",system-ui,sans-serif;
  --display:"Unbounded","Bahnschrift","Segoe UI Semibold",system-ui,sans-serif;
  --ui:"Exo 2","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","Consolas",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--fg);font:14px/1.5 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
code{font-family:var(--mono);font-size:.92em;color:var(--cyan)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr) 32px;height:100%;
  background:radial-gradient(1200px 700px at 60% 45%,rgba(25,243,255,.06),transparent 60%),radial-gradient(900px 600px at 15% 100%,rgba(255,43,214,.07),transparent 60%),var(--void)}
.app.open{grid-template-columns:250px minmax(0,1fr) 430px}
/* scanlines and vignette */
.app::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
/* rail */
.rail{grid-row:1;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(13,20,48,.9),rgba(5,7,18,.95));padding:16px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font:800 17px/1.1 var(--brand);letter-spacing:.14em;color:var(--fg);text-shadow:0 0 12px rgba(25,243,255,.55)}
.brand span{font:500 10px var(--mono);letter-spacing:.18em;color:var(--pink);text-transform:uppercase}
.sect{display:flex;flex-direction:column;gap:2px}
.sect h4{margin:0 0 6px;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.navb{display:flex;align-items:center;gap:10px;padding:6px 9px;color:var(--dim);text-align:left;width:100%;font:600 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.navb:hover{background:rgba(25,243,255,.06);color:var(--fg)}
.navb.on{background:linear-gradient(90deg,rgba(25,243,255,.16),rgba(25,243,255,.02));color:var(--cyan);box-shadow:inset 2px 0 0 var(--cyan)}
.navb em{margin-left:auto;font:400 11px var(--mono);font-style:normal;color:var(--faint)}
.navb i{font-style:normal;font-family:var(--mono);color:var(--faint);font-size:10px;width:16px}
.fam{display:flex;align-items:center;gap:9px;padding:5px 8px;width:100%;text-align:left;color:var(--fg)}
.fam:hover{background:rgba(255,255,255,.04)}
.fam .sw{width:9px;height:9px;transform:rotate(45deg);flex:none}
.fam b{font:600 13px var(--ui);letter-spacing:.04em}
.fam small{margin-left:auto;font:11px var(--mono);color:var(--dim);white-space:nowrap}
.fam.off b{color:var(--faint)} .fam.off small{color:var(--red)}
.live{display:flex;flex-direction:column;gap:6px;font-size:13px}
.live div{display:flex;align-items:center;gap:8px}
.live small{margin-left:auto;color:var(--dim);font:11px var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.run{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.foot{margin-top:auto;color:var(--faint);font:11px var(--mono);display:flex;flex-direction:column;gap:2px}
/* main */
.main{grid-row:1;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:22px;align-items:flex-end;justify-content:space-between;padding:14px 24px 10px;flex-wrap:wrap;border-bottom:1px solid rgba(26,36,72,.7)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.2em;color:var(--pink);text-transform:uppercase;display:flex;gap:12px;align-items:center}
.eyebrow .lv{color:var(--ok);display:inline-flex;gap:6px;align-items:center}
h1{margin:4px 0 0;font:700 26px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;position:relative}
h1::after{content:"_";color:var(--cyan);animation:blink 1.1s steps(1) infinite;margin-left:4px}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:0}
.glitch::before{color:var(--pink);animation:gl1 7s infinite steps(1)}
.glitch::after{color:var(--cyan);animation:gl2 7s infinite steps(1)}
@keyframes gl1{0%,92%,100%{opacity:0;transform:none}93%{opacity:.8;transform:translate(-3px,1px);clip-path:inset(0 0 60% 0)}95%{opacity:.8;transform:translate(2px,-1px);clip-path:inset(50% 0 0 0)}}
@keyframes gl2{0%,93%,100%{opacity:0;transform:none}94%{opacity:.8;transform:translate(3px,0);clip-path:inset(30% 0 30% 0)}96%{opacity:.7;transform:translate(-2px,1px);clip-path:inset(0 0 70% 0)}}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;align-items:flex-end;padding:4px 10px;border:1px solid var(--line);background:rgba(9,13,30,.6);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.kpi b{font:600 17px var(--mono);font-variant-numeric:tabular-nums;color:var(--cyan);text-shadow:0 0 10px rgba(25,243,255,.35)}
.kpi span{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kpi.pk b{color:var(--pink);text-shadow:0 0 10px rgba(255,43,214,.35)} .kpi.yl b{color:var(--yellow);text-shadow:none} .kpi.rd b{color:var(--red)}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pane{position:absolute;inset:0;overflow:auto;padding:14px 24px 40px}
.hint{position:absolute;left:24px;bottom:12px;max-width:640px;font:11.5px var(--mono);color:var(--faint);pointer-events:none}
.crumb{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(9,13,30,.9);border:1px solid var(--line2);padding:4px 6px;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.crumb button{padding:3px 9px;color:var(--dim)} .crumb button:hover{color:var(--cyan)}
.crumb b{color:var(--cyan);padding:0 8px;min-width:120px;text-align:center}
.banner{margin:10px 24px 0;border:1px solid rgba(255,181,71,.6);color:var(--warn);background:rgba(255,181,71,.06);padding:8px 12px;font-size:13px}
/* ticker */
.ticker{grid-column:1 / -1;grid-row:2;border-top:1px solid var(--line2);background:#03040b;display:flex;align-items:center;overflow:hidden;font:12px var(--mono);white-space:nowrap}
.ticker .lbl{flex:none;padding:0 12px;height:100%;display:flex;align-items:center;gap:6px;background:var(--pink);color:#05010a;font-weight:600;letter-spacing:.16em}
.ticker .win{overflow:hidden;flex:1;min-width:0}
.ticker .track{display:inline-block;padding-left:100%;animation:tick 80s linear infinite;color:var(--dim)}
.ticker .track span{margin-right:42px} .ticker .track b{color:var(--cyan);font-weight:400} .ticker .track em{font-style:normal;color:var(--yellow)}
.ticker .track .x{color:var(--red)}
@keyframes tick{to{transform:translateX(-100%)}}
/* panes */
h3.sec{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;margin:26px 0 10px;color:var(--fg);display:flex;align-items:center;gap:10px}
h3.sec::before{content:"";width:14px;height:2px;background:var(--pink);box-shadow:0 0 8px var(--pink)}
h3.sec:first-child{margin-top:4px}
h3.sec small{font:400 11px var(--mono);letter-spacing:.04em;text-transform:none;color:var(--dim)}
.lead{color:var(--dim);max-width:900px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 10px var(--mono);text-align:left;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;padding:7px 8px;border-bottom:1px solid var(--line2);position:sticky;top:-14px;background:var(--void);z-index:1}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:rgba(25,243,255,.04)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.trunc{max-width:440px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--line2);padding:0 7px;font:11px/18px var(--mono);color:var(--dim);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(61,255,168,.45)} .tag.bad{color:var(--red);border-color:rgba(255,59,92,.5)} .tag.warn{color:var(--warn);border-color:rgba(255,181,71,.5)}
.tag.cy{color:var(--cyan);border-color:rgba(25,243,255,.45)} .tag.pk{color:var(--pink);border-color:rgba(255,43,214,.45)}
.btn{border:1px solid var(--line2);padding:4px 12px;color:var(--dim);font:12px var(--mono)} .btn:hover{color:var(--cyan);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;border:1px solid var(--line);background:linear-gradient(160deg,rgba(13,20,48,.85),rgba(6,9,22,.9));padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.card:hover{border-color:var(--line2);background:linear-gradient(160deg,rgba(20,30,70,.9),rgba(6,9,22,.9))}
.card::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--c,var(--cyan));box-shadow:0 0 10px var(--c,var(--cyan))}
.card h4{margin:0;font:700 13.5px/1.25 var(--display);letter-spacing:.03em;display:flex;gap:8px;align-items:center}
.card .id{font:11px var(--mono);color:var(--dim)}
.card p{margin:0;font-size:13px;color:var(--dim)}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:11px var(--mono)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border:1px solid var(--line2);font:11px/18px var(--mono);white-space:nowrap}
.chip .sw{width:7px;height:7px;transform:rotate(45deg)}
.arrow{color:var(--faint)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:6px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--cyan));box-shadow:0 0 8px var(--c,var(--cyan))}
.empty{color:var(--dim);padding:8px 0}
.note{border-left:2px solid var(--line2);padding:2px 0 2px 12px;color:var(--dim);font-size:13px;max-width:900px}
.note b{color:var(--fg)}
.prose{max-width:860px;display:flex;flex-direction:column;gap:10px}
.prose p{margin:0} .prose ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
/* hierarchy */
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.tnode{border:1px solid var(--line2);background:rgba(9,13,30,.9);padding:9px 18px;text-align:center;min-width:240px;max-width:560px;cursor:pointer;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.tnode:hover{border-color:var(--cyan)}
.tnode b{display:block;font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase}
.tnode span{font:11px var(--mono);color:var(--dim)}
.tlink{width:1px;height:22px;background:linear-gradient(var(--cyan),var(--pink));box-shadow:0 0 6px var(--cyan)}
.tpair{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.kv1{border:1px solid var(--line);padding:8px 10px;background:rgba(9,13,30,.6)}
.kv1 b{display:block;font:600 19px var(--mono);color:var(--cyan)} .kv1 span{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kv1.pk b{color:var(--pink)} .kv1.yl b{color:var(--yellow)}
/* chart */
.chart{border:1px solid var(--line);background:rgba(9,13,30,.6);padding:10px 12px;overflow-x:auto}
.chart svg{display:block}
/* dossier */
.dossier{grid-row:1;border-left:1px solid var(--line2);background:linear-gradient(180deg,rgba(10,15,36,.97),rgba(5,7,18,.98));overflow:auto;min-width:0;position:relative}
.app:not(.open) .dossier{border:0;overflow:hidden}
.dhead{position:sticky;top:0;background:rgba(10,15,36,.98);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--pink);z-index:2}
.dhead button{font-size:20px;line-height:1;padding:2px 6px;color:var(--dim)} .dhead button:hover{color:var(--cyan)}
.dbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.dbody h2{margin:0;font:700 18px/1.25 var(--display);letter-spacing:.03em;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.blk h5{margin:0 0 7px;font:600 10.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);display:flex;gap:8px;align-items:center}
.blk h5::before{content:"//";color:var(--pink)}
.blk p{margin:0;font-size:13.5px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-word}
pre.box{margin:0;background:#03040b;border:1px solid var(--line);padding:10px;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:380px;overflow:auto;color:#c9d3ff}
.list{display:flex;flex-direction:column;border:1px solid var(--line)}
.list > *{display:flex;gap:8px;align-items:baseline;padding:6px 9px;border-top:1px solid var(--line);text-align:left;font-size:13px;width:100%}
.list > :first-child{border-top:0}
.list button:hover{background:rgba(25,243,255,.05)}
.list .r{margin-left:auto;color:var(--dim);font:11px var(--mono);white-space:nowrap}
.ladder{display:flex;flex-direction:column;gap:0;border:1px solid var(--line)}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:8px 10px;border-top:1px solid var(--line);text-align:left;width:100%}
.step:first-child{border-top:0}
.step .n{font:700 15px var(--mono);color:var(--c,var(--cyan));text-shadow:0 0 8px var(--c,var(--cyan))}
.step b{font-weight:600} .step small{display:block;color:var(--dim);font:11.5px var(--mono)}
button.step:hover{background:rgba(25,243,255,.05)}
.ref{color:var(--faint);font:11px var(--mono)}
/* boot */
.boot{position:fixed;inset:0;z-index:60;background:#020308;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s}
.boot.done{opacity:0;pointer-events:none}
.boot pre{margin:0;font:13px/1.75 var(--mono);color:var(--cyan);text-shadow:0 0 8px rgba(25,243,255,.6);min-width:min(640px,90vw)}
.boot pre .p{color:var(--pink)} .boot pre .y{color:var(--yellow)} .boot pre .r{color:var(--red)} .boot pre .g{color:var(--ok)}
.boot h2{font:800 30px var(--brand);letter-spacing:.2em;margin:0 0 18px;color:var(--fg);text-shadow:0 0 18px rgba(255,43,214,.7)}
@media (max-width:1100px){.app.open{grid-template-columns:200px minmax(0,1fr) 360px}.app{grid-template-columns:200px minmax(0,1fr) 0}}
@media (prefers-reduced-motion:reduce){.dot.run,h1::after,.glitch::before,.glitch::after{animation:none}.ticker .track{animation-duration:400s}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="brand"><b class="glitch" data-text="COUNCIL ENGINE">COUNCIL ENGINE</b><span id="host">мультимодельная система</span></div>
    <div class="sect" id="views"><h4>Разделы</h4></div>
    <div class="sect"><h4>Семейства моделей</h4><div id="fams"></div></div>
    <div class="sect"><h4>Сейчас</h4><div class="live" id="live"></div></div>
    <div class="foot" id="foot"></div>
  </aside>

  <main class="main">
    <div class="top">
      <div><div class="eyebrow"><span id="eyebrow">// живая карта</span><span class="lv" id="lv"></span></div><h1 id="title"><span class="glitch" data-text="Система">Система</span></h1></div>
      <div class="kpis" id="kpis"></div>
    </div>
    <div id="banners"></div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint"></div>
      <div class="crumb" id="crumb" hidden><button id="cBack">⟵ система</button><button id="cPrev" aria-label="Предыдущий">◂</button><b id="cName"></b><button id="cNext" aria-label="Следующий">▸</button></div>
      <div class="pane" id="pane" hidden></div>
    </div>
  </main>

  <aside class="dossier" id="dossier">
    <div class="dhead"><span id="dpath"></span><button id="close" aria-label="Закрыть">×</button></div>
    <div class="dbody" id="dbody"></div>
  </aside>

  <div class="ticker"><div class="lbl"><span class="dot run" style="background:#05010a;box-shadow:none"></span>LIVE</div><div class="win"><div class="track" id="track"></div></div></div>
</div>
<div class="boot" id="boot"><div><h2>COUNCIL ENGINE</h2><pre id="bootText"></pre></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => v == null || v === "" || isNaN(v) ? null : Number(v);
const fmtN = v => num(v) == null ? "—" : Math.round(v).toLocaleString("ru-RU");
const fmtTok = v => { v = num(v); if (v == null) return "—"; if (v >= 1e6) return (v/1e6).toFixed(2).replace(".", ",")+" M"; if (v >= 1e4) return (v/1e3).toFixed(1).replace(".", ",")+" K"; return fmtN(v); };
const fmtUsd = v => { v = num(v); if (v == null) return "—"; if (v === 0) return "$0"; return "$" + (v < 0.01 ? v.toFixed(6).replace(/0+$/, "") : v.toFixed(2)); };
const fmtTime = t => t ? new Date(t*1000).toLocaleTimeString("ru-RU") : "—";
const fmtDate = t => t ? new Date(t*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const fmtAgo = t => { if (!t) return "—"; const s = Math.max(0, Date.now()/1000 - t);
  if (s < 60) return Math.round(s)+" с назад"; if (s < 3600) return Math.round(s/60)+" мин назад";
  if (s < 86400) return Math.round(s/3600)+" ч назад"; return Math.round(s/86400)+" дн назад"; };

function tokenChart(){
  const h = SYS.history.filter(e => num(e.total_tokens) != null);
  if (!h.length) return `<div class="empty">История запросов пуста.</div>`;
  const max = Math.max(...h.map(e => num(e.total_tokens))), bw = 22, gap = 6, ch = 150, w = h.length*(bw+gap) + 60;
  const ticks = [0, 0.5, 1].map(f => Math.round(max*f));
  return `<div class="chart"><svg width="${w}" height="${ch+46}" role="img" aria-label="Токены по запросам">
    ${ticks.map(t => { const y = 8 + ch - (t/max)*ch; return `<line x1="50" x2="${w}" y1="${y}" y2="${y}" stroke="#1a2448"/><text x="44" y="${y+4}" fill="#8d98c6" font-size="10" text-anchor="end" font-family="JetBrains Mono, monospace">${fmtTok(t)}</text>`; }).join("")}
    ${h.map((e, i) => { const v = num(e.total_tokens), bh = Math.max(2, v/max*ch), x = 56 + i*(bw+gap), y = 8 + ch - bh, c = FAM[e.fam].c;
      const pr = num(e.prompt_tokens) || 0, ph = v ? pr/v*bh : 0;
      return `<g><title>${esc(e.timestamp)} · ${esc(e.provider)} · ${esc(e.model)}\nвход ${fmtN(e.prompt_tokens)} · выход ${fmtN(e.completion_tokens)} · всего ${fmtN(v)} · ${fmtUsd(e.cost)}</title>
        <rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${hexA(c,.85)}"/><rect x="${x}" y="${y+bh-ph}" width="${bw}" height="${ph}" fill="${hexA(c,.35)}"/>
        <text x="${x+bw/2}" y="${ch+24}" fill="#8d98c6" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">${esc(String(e.timestamp || "").slice(11, 16))}</text>
        <text x="${x+bw/2}" y="${ch+36}" fill="#4f5a88" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">${esc(String(e.timestamp || "").slice(8, 10)+"."+String(e.timestamp || "").slice(5, 7))}</text></g>`; }).join("")}
  </svg><div class="faint" style="font-size:12px;margin-top:4px">Каждый столбик: один ответ модели. Светлая часть: токены ответа, тёмная: токены запроса. Наведи, чтобы увидеть пул и модель.</div></div>`;
}
function viewTokens(){

      <div class="kv1"><b>${fmtN(T.total_completion_tokens)}</b><span>токенов в ответах</span></div>

      ${rows.filter(r => r.credit != null).map(r => `<div class="card" style="--c:${FAM[r.fam].c}" data-open="pool:${esc(r.key)}"><h4>${esc(r.key)}</h4><div class="id">credit из последнего ответа API: ${esc(r.credit)}</div><p>Это значение провайдер прислал в поле usage. Что именно оно означает, знает только провайдер.</p></div>`).join("")}
    </div>
    <h3 class="sec">По семействам</h3>
    <div class="list">${famRows.map(f => `<button data-open="fam:${f.key}" style="align-items:center">${sw(f.key)}<b style="min-width:90px">${esc(FAM[f.key].n)}</b>
      <span class="bar" style="flex:1;--c:${FAM[f.key].c}"><i style="width:${f.tokens/famMax*100}%"></i></span>

    <h3 class="sec">По пулам <small>by_provider</small></h3>

    ${rows.map(r => `<tr ${r.p ? `data-open="pool:${esc(r.key)}"` : ""}><td>${sw(r.fam)} ${esc(r.key)}${!r.p ? `<div class="faint" style="font-size:12px">${r.via.length ? "записано по имени модели: так мост пишет вызовы через Claude-шлюз (пулы "+r.via.map(p => esc(p.id)).join(", ")+")" : "пула с таким именем нет в providers.json"}</div>` : ""}</td>
      <td class="mono muted">${esc(r.model || "—")}</td><td class="num">${fmtN(r.requests)}</td><td class="num">${fmtN(r.prompt)}</td><td class="num">${fmtN(r.completion)}</td><td class="num">${fmtN(r.total)}</td><td class="num">${fmtUsd(r.cost)}</td>

}

function viewLog(){
  const cs = calls();
  const head = `<p class="lead">Записывает прослойка журнала у моста: кто вызвал, какой инструмент, какая роль и какой пул отвечали, сколько длилось и чем закончилось. Токены взяты из token_usage.json, если ответ модели попал в учёт во время вызова. Папка: <code>${esc(ST.activity.log_dir)}</code>, хранится 30 дней.</p>`;
  return head + (cs.length ? `<table><thead><tr><th>Время</th><th>Кто</th><th>Инструмент</th><th>Роль</th><th>Пул</th><th class="num">Длилось</th><th class="num">Токены</th><th>Итог</th><th>Запрос</th></tr></thead><tbody>
    ${cs.map(c => { const a = callAgent(c), pv = callProvs(c), tk = callTok(c), fails = (c.route || []).filter(r => r.ok === false).length;
      const st = isRun(c) ? `<span class="tag warn">идёт</span>` : c.orphan ? `<span class="tag bad">оборван</span>` : c.error ? `<span class="tag bad">ошибка</span>` : `<span class="tag ok">готово</span>`;
      return `<tr data-open="call:${esc(c.id)}"><td class="mono muted">${fmtTime(c.start)}</td><td>${esc(CLIENT[c.client]?.n || c.client)}</td><td class="mono">${esc(c.tool)}</td>
        <td>${a ? esc(SYS.agent[a]?.name || a) : `<span class="faint">—</span>`}</td><td class="mono">${pv.length ? pv.map(esc).join(" › ") : `<span class="faint">—</span>`}${fails ? ` <span class="tag warn">${fails} запасн.</span>` : ""}${c.cli_missing ? ` <span class="tag warn">без CLI</span>` : ""}</td>
        <td class="num">${fmtMs(c.ms)}</td><td class="num">${tk ? fmtN(tk) : "—"}</td><td>${st}</td><td class="trunc muted">${esc(callQuery(c))}</td></tr>`; }).join("")}

}

function viewProc(){
  const groups = [["antigravity","Antigravity"],["claude","Claude Code"],["tap","Журнал вызовов (прослойка)"],["bridge","MCP-мосты"],["bridge-child","Задачи, запущенные мостами"],["gateway","Шлюз AI Duo (NewGenMMLLM)"],["app","Это приложение"]];
  const err = ST.processes.error ? `<div class="banner" style="margin:0 0 10px">Не удалось прочитать список процессов: ${esc(ST.processes.error)}</div>` : "";
  return err + groups.map(([g, title]) => {
    const list = procs(g).sort((a, b) => (a.start || 0) - (b.start || 0));
    if (g === "gateway" && !list.length) return "";
    const mem = list.reduce((a, p) => a + (p.rss || 0), 0);
    return `<h3 class="sec">${title} <small>${list.length} · ${fmtMB(mem)}</small></h3>` + (list.length ? `
      <table><thead><tr><th class="num">PID</th><th>Процесс</th><th>Запущен</th><th class="num">Память</th><th class="num">CPU</th><th>Командная строка</th></tr></thead><tbody>
      ${list.map(p => `<tr data-open="proc:${p.pid}"><td class="num">${p.pid}</td><td>${esc(p.name)}</td><td class="mono muted" style="white-space:nowrap">${fmtDate(p.start)}</td>
        <td class="num">${fmtMB(p.rss || 0)}</td><td class="num">${p.cpu == null ? "—" : p.cpu.toFixed(1)+"%"}</td><td class="trunc mono muted" title="${esc(p.cmd)}">${esc(p.cmd)}</td></tr>`).join("")}

  }).join("");
}

const radius = n => ({core:0, client:24, server:13, role:15, pool:11, family:14, tool:8, skill:9})[n.type] * (n.big ? 1.6 : mode.kind === "focus" && n.ta ? 1.25 : 1);

function drawNode(n, t){

    ctx.fillStyle = c; ctx.font = '700 12px "Unbounded", sans-serif'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(CLIENT[n.key].g, n.x, n.y + 1);
    ctx.fillStyle = n.alive ? "#3dffa8" : "#4f5a88"; ctx.beginPath(); ctx.arc(n.x + r*.8, n.y - r*.7, 4, 0, 7); ctx.fill(); }

    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(n.x, n.y, 2.4, 0, 7); ctx.fill();
    if (n.dflt) { poly(n.x, n.y, r*1.25 + 6, 4, 0); ctx.strokeStyle = hexA(c, .5); ctx.lineWidth = 1; ctx.stroke(); }
    if (n.alias) { ctx.fillStyle = "#ffb547"; ctx.font = '700 11px "JetBrains Mono", monospace'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("!", n.x + r*1.5, n.y - r*1.1); } }
  else if (n.type === "family") { poly(n.x, n.y, r, 4, 0); ctx.fillStyle = hexA(c, .2); ctx.fill(); ctx.stroke(); }

function line(a, b, o){

function packet(pts, t, c){

  if (!L) return;
  for (let k = 0; k < 3; k++) { let f = ((t/1500) + k/3) % 1 * L, i = 0; while (i < segs.length - 1 && f > segs[i]) { f -= segs[i]; i++; }
    const a = pts[i], b = pts[i+1], u = segs[i] ? f/segs[i] : 0, x = a.x + (b.x - a.x)*u, y = a.y + (b.y - a.y)*u;

}
function draw(t){
  requestAnimationFrame(draw);
  if (view !== "sys" || !W || !SYS || !NODES.has("core")) return;
  const dt = Math.min(64, t - (tPrev || t)); tPrev = t;
  const slow = hover ? .15 : 1;
  if (!reduce) { rotA -= dt*0.000035*slow; rotB += dt*0.000022*slow; }
  targets();
  const k = reduce ? 1 : 0.12;
  NODES.forEach(n => { if (n.x == null) { n.x = n.tx; n.y = n.ty; } n.x += (n.tx - n.x)*k; n.y += (n.ty - n.y)*k; n.a += (n.ta - n.a)*(reduce ? 1 : .1); n.heat = Math.max(0, n.heat - dt/2500); });
  drawBackground(t);
  const core = NODES.get("core"), by = id => NODES.get(id);
  const sel = hover || (selRef ? by(refToNode(selRef) || "") : null);
  if (mode.kind === "system") {
    // core spokes to clients
    NODES.forEach(n => { if (n.type === "client") line(n, core, {color:n.color, alpha:n.alive ? .45 : .15, dash:!n.alive});
      if (n.type === "server") { const cl = by("c:"+n.client); if (cl) line(cl, n, {alpha:.25, dot:true}); } });
    // ring guides
    ctx.strokeStyle = "rgba(25,243,255,.07)"; ctx.lineWidth = 1;

      const hot = sel && (sel === rn || a.chain.some(p => sel.id === "p:"+p) || (sel.type === "family" && SYS.prov[a.primary]?.fam === sel.key));
      a.chain.forEach((p, i) => { const pn = by("p:"+p); if (!pn) return; const on = hot && (sel === rn || sel === pn || sel.type === "family");
        line(rn, pn, {color:pn.color, alpha:on ? (i ? .55 : .95) : sel ? (i ? .03 : .08) : (i ? .07 : .3), dash:i > 0, w:on ? 1.6 : 1}); }); });

requestAnimationFrame(draw);
function hit(e){

cv.addEventListener("mousemove", e => { hover = hit(e); cv.style.cursor = hover ? "pointer" : "default"; });
cv.addEventListener("mouseleave", () => hover = null);
cv.addEventListener("click", e => {
  const n = hit(e); if (!n) return;

addEventListener("keydown", e => {
  if (e.key !== "Escape") return;

// ---------- boot: real numbers only
function boot(){
  let seen = false; try { seen = sessionStorage.getItem("ce-boot") === "1"; sessionStorage.setItem("ce-boot", "1"); } catch (e) {}
  const el = $("#boot");
  if (seen || reduce) { el.classList.add("done"); return; }

  const famTxt = famList().filter(k => SYS.fam[k].pools.length).map(k => FAM[k].n+" "+SYS.fam[k].pools.length).join(" · ");

    `<span class="p">&gt;</span> ${esc(dots("процессы агентов", 26))}${procs().length} найдено`,
    `<span class="p">&gt;</span> ${esc(dots("antigravity", 26))}${ag ? `<span class="g">ONLINE</span> (${ag} проц.)` : `<span class="y">OFFLINE</span>`}`,
    `<span class="p">&gt;</span> ${esc(dots(SYS.core?.name || "мост", 26))}${SYS.tools.length} инструментов`,
    `<span class="p">&gt;</span> ${esc(dots("пулы моделей", 26))}${SYS.providers.length}${famTxt ? " ("+esc(famTxt)+")" : ""}`,
    `<span class="p">&gt;</span> ${esc(dots("роли", 26))}${SYS.agents.length}`,

    ...ALWAYS.filter(k => !SYS.fam[k].pools.length).map(k => `<span class="p">&gt;</span> ${esc(dots(FAM[k].n.toLowerCase(), 26))}<span class="r">НЕ ПОДКЛЮЧЕНА</span>`),
    `<span class="p">&gt;</span> ${esc(dots("claude cli", 26))}${cliOk() ? `<span class="g">найден</span>` : `<span class="y">не установлен</span>`}`,

setView(view);
Promise.all([getJSON("/api/config"), getJSON("/api/state")]).then(([c, s]) => {
