/* Council Engine 4.1, "Observatory". The system drawn the way a celestial atlas draws the sky: an ink-blue
   field, engraved ivory hairlines with graduated rings, a serif for names and titles (atlas plates), a sans for
   reading, a mono for numbers. One brass accent for anything happening right now, red only for failures,
   muted hand-tinted hues for model families. Labels stay off the map until they are needed.
   Every number on screen comes from this computer; reference text about model families is labelled. */
@font-face{font-family:"CE Serif";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/cormorant-garamond-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"CE Serif";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"CE Serif";font-style:italic;font-weight:500;font-display:swap;src:url(/fonts/cormorant-garamond-cyrillic-500-italic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"CE Serif";font-style:italic;font-weight:500;font-display:swap;src:url(/fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:"CE Serif";font-style:italic;font-weight:600;font-display:swap;src:url(/fonts/cormorant-garamond-cyrillic-600-italic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"CE Serif";font-style:italic;font-weight:600;font-display:swap;src:url(/fonts/cormorant-garamond-latin-600-italic.woff2) format("woff2")}
@font-face{font-family:"Geologica Variable";font-style:oblique 0deg 12deg;font-display:swap;font-weight:100 900;
  src:url(/fonts/geologica-cyrillic-full-normal.woff2) format("woff2-variations");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Geologica Variable";font-style:oblique 0deg 12deg;font-display:swap;font-weight:100 900;
  src:url(/fonts/geologica-latin-full-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Martian Mono Variable";font-style:normal;font-display:swap;font-weight:100 800;font-stretch:75% 112.5%;
  src:url(/fonts/martian-mono-cyrillic-standard-normal.woff2) format("woff2-variations");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Martian Mono Variable";font-style:normal;font-display:swap;font-weight:100 800;font-stretch:75% 112.5%;
  src:url(/fonts/martian-mono-latin-standard-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#060810; --bg1:#0b0f18; --bg2:#111624; --glass:rgba(7,9,16,.74); --glass2:rgba(8,11,19,.93);
  --line:rgba(222,208,180,.10); --line2:rgba(222,208,180,.19); --line3:rgba(222,208,180,.34);
  --fg:#efe9dc; --fg2:#aba596; --fg3:#716e67;
  --live:#e9b660; --live-a:rgba(233,182,96,.13); --bad:#e46c5b; --bad-a:rgba(228,108,91,.12); --ok:#9fd4b6;
  --serif:"CE Serif","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Geologica Variable","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Martian Mono Variable","Cascadia Mono","Consolas",ui-monospace,monospace;
  --side:268px; --dos:440px; --tl:84px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:380 14px/1.55 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--live);outline-offset:2px}
code{font:400 .86em var(--mono);font-stretch:87.5%;color:var(--fg)}
.mono{font-family:var(--mono);font-stretch:87.5%;font-size:12px}
.lab{font:italic 500 14.5px/1.15 var(--serif);letter-spacing:.01em;color:#8f897b}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}
.num{font-family:var(--mono);font-stretch:87.5%;font-variant-numeric:tabular-nums}

/* 3D layer */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
#labels.off{opacity:0}
.l3{transform:translate(-50%,0);margin-top:14px;text-align:center;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.l3 b{display:block;font:450 12px/1.2 var(--sans);color:var(--fg);text-shadow:0 0 8px var(--bg),0 0 3px var(--bg)}
.l3 i{display:block;font:400 9.5px/1.4 var(--mono);font-stretch:87.5%;font-style:normal;color:var(--fg3);text-shadow:0 0 4px var(--bg)}
.l3.pool b{font:500 10.5px/1.2 var(--mono);font-stretch:87.5%;color:var(--fg2)}
.l3.famlab{margin-top:0;transform:translate(-50%,-50%)}
.l3.famlab b{font:italic 600 19px/1 var(--serif);letter-spacing:.01em}
.l3.famlab i{margin-top:3px}
.l3.core{margin-top:26px} .l3.core b{font:600 16px/1.1 var(--serif);letter-spacing:.16em;text-transform:uppercase;color:#f3dfb8}
.l3.deg{margin-top:0;transform:translate(-50%,-50%)} .l3.deg b{font:400 9px var(--mono);font-stretch:87.5%;color:rgba(222,208,180,.32);text-shadow:none}
.l3.tool{margin-top:6px} .l3.tool b{font:400 9.5px var(--mono);font-stretch:87.5%;color:var(--fg2)}
.l3.client b{font:600 16px/1.1 var(--serif);letter-spacing:.01em}
.l3.hot b{color:var(--live)} .l3.sel b{color:#fff} .l3.dim{opacity:.18!important} .l3.hid{opacity:0!important}
.l3.role i,.l3.pool i{display:none} .l3.role.near i,.l3.pool.near i,#labels.close .l3 i{display:block}
.l3 .st{color:var(--live)}
.l3 i.pz{display:block!important;color:var(--live)}
.chip.paused{border-style:dashed;color:var(--fg2)}

/* frame */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--side) minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr) var(--tl);pointer-events:none}
.app.open{grid-template-columns:var(--side) minmax(0,1fr) var(--dos)}
.app > *{pointer-events:auto}
.side{grid-row:1 / 3;grid-column:1;display:flex;flex-direction:column;gap:22px;padding:22px 20px 18px 22px;overflow:auto;min-width:0;
  background:linear-gradient(90deg,rgba(6,8,16,.95) 0,rgba(6,8,16,.86) 78%,rgba(6,8,16,0) 100%);scrollbar-width:thin}
.brand{display:flex;gap:11px;align-items:center}
.brand svg{flex:none}
.brand b{display:block;font:600 22px/1 var(--serif);letter-spacing:.01em}
.brand span{font:400 10.5px var(--mono);font-stretch:87.5%;color:var(--fg3)}
.nav{display:flex;flex-direction:column}
.nav button{display:flex;align-items:center;gap:10px;padding:5px 0;color:var(--fg2);font:420 14px var(--sans);text-align:left;width:100%}
.nav button::before{content:"";width:10px;height:1px;background:var(--line3);transition:width .2s,background .2s}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--fg)} .nav button.on::before{width:18px;background:var(--live)}
.nav button em{margin-left:auto;font:400 10.5px var(--mono);font-stretch:87.5%;font-style:normal;color:var(--fg3)}
.nav button .pip{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);margin-left:-2px}
.sec6{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kpis div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis b{font:430 17px/1.15 var(--mono);font-stretch:87.5%;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis b.bad{color:var(--bad)} .kpis b.live{color:var(--live)}
.fams{display:flex;flex-direction:column}
.fam{display:flex;align-items:center;gap:9px;padding:3px 0;width:100%;text-align:left;color:var(--fg)}
.fam:hover b{color:#fff}
.fam b{font:450 13.5px var(--sans)}
.fam small{margin-left:auto;font:400 10.5px var(--mono);font-stretch:87.5%;color:var(--fg3);white-space:nowrap}
.fam.off b{color:var(--fg3)} .fam.off small{color:var(--bad)}
.sw{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.sw.hollow{background:transparent!important;border:1px solid currentColor}
.lg{width:13px;height:13px;flex:none;display:inline-block;vertical-align:-2px;fill:currentColor}
.lg.hollow{fill:none;stroke:currentColor;stroke-width:1.3;opacity:.8}
.live{display:flex;flex-direction:column;gap:5px;font-size:13px}
.live div{display:flex;align-items:center;gap:8px;min-width:0}
.live small{margin-left:auto;color:var(--fg3);font:400 10.5px var(--mono);font-stretch:87.5%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.live .ag{display:block;color:var(--fg2);font-size:12px;line-height:1.4;padding-left:15px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:var(--fg3);opacity:.6}
.dot.ok{background:var(--ok);opacity:1} .dot.warn{background:var(--live);opacity:1} .dot.bad{background:var(--bad);opacity:1}
.dot.run{background:var(--live);opacity:1;box-shadow:0 0 0 0 var(--live);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(254,179,84,.55)}80%,100%{box-shadow:0 0 0 7px rgba(254,179,84,0)}}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;font:400 10.5px var(--mono);font-stretch:87.5%;color:var(--fg3)}

.center{grid-row:1;grid-column:2;position:relative;min-width:0;min-height:0;pointer-events:none}
.center > *{pointer-events:auto}
.caption{position:absolute;left:8px;bottom:16px;max-width:min(560px,100%);display:flex;flex-direction:column;gap:7px;text-shadow:0 0 10px var(--bg),0 0 3px var(--bg)}
.caption .plate{font:italic 500 14px var(--serif);color:#8f897b;display:flex;align-items:center;gap:10px}
.caption .plate::after{content:"";width:46px;height:1px;background:var(--line3)}
.caption h1{margin:0;font:600 36px/1 var(--serif);letter-spacing:.005em;text-wrap:balance}
.caption .facts{font:400 11px/1.5 var(--mono);font-stretch:87.5%;color:var(--fg2);font-variant-numeric:tabular-nums}
.caption .facts b{font-weight:500;color:var(--fg)}
.caption p{margin:0;color:var(--fg2);font-size:13px;max-width:520px}
.legbtn{align-self:flex-start;font:italic 500 14px var(--serif);color:var(--fg2);border-bottom:1px solid var(--line2);padding:0 0 1px}
.legbtn:hover{color:var(--fg);border-color:var(--line3)}
.legwrap{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--glass2);border:1px solid var(--line2);border-radius:3px;box-shadow:inset 0 0 0 3px var(--glass2),inset 0 0 0 4px var(--line);text-shadow:none}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:5px 18px;color:var(--fg2);font:400 10.5px var(--mono);font-stretch:87.5%}
.legend span{display:inline-flex;align-items:center;gap:6px}
.banner{border:1px solid rgba(254,179,84,.45);background:var(--live-a);color:var(--fg);padding:8px 12px;font-size:13px;border-radius:3px}
.banner.bad{border-color:rgba(239,103,90,.5);background:var(--bad-a)}
.banners{position:absolute;left:8px;right:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.crumb{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;white-space:nowrap;align-items:center;gap:2px;background:var(--glass2);border:1px solid var(--line2);border-radius:3px;padding:3px;backdrop-filter:blur(10px)}
.crumb button{padding:4px 10px;color:var(--fg2);font:400 12px var(--sans);border-radius:2px} .crumb button:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.crumb b{padding:0 10px;min-width:120px;text-align:center;font:italic 600 16px var(--serif)}

/* sheet: every view except the map */
.sheet{position:absolute;inset:16px 16px 10px 4px;display:flex;flex-direction:column;background:var(--glass2);border:1px solid var(--line2);border-radius:3px;
  backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);box-shadow:inset 0 0 0 4px var(--glass2),inset 0 0 0 5px var(--line),0 30px 80px rgba(0,0,0,.5);min-height:0}
.sheet > header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 30px 15px;margin:0 5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet h1{margin:0;font:600 36px/1 var(--serif);letter-spacing:.005em}
.sheet header p{margin:4px 0 0;color:var(--fg2);font-size:13px;max-width:760px}
.pane{flex:1;min-height:0;overflow:auto;padding:18px 35px 40px;margin:0 5px 5px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.pane.fill{padding:0;overflow:hidden;display:flex}
h3.sec{display:flex;align-items:baseline;gap:12px;margin:32px 0 12px;font:600 23px/1.1 var(--serif);letter-spacing:.005em}
h3.sec:first-child{margin-top:6px}
h3.sec small{font:400 10.5px var(--mono);font-stretch:87.5%;color:var(--fg3);letter-spacing:.02em}
.lead{color:var(--fg2);max-width:860px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 9.5px var(--mono);font-stretch:87.5%;text-align:left;color:var(--fg3);letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line2);position:sticky;top:-16px;background:var(--glass2);z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:rgba(255,255,255,.025)}
.trunc{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);padding:0 7px;border-radius:2px;font:400 10.5px/19px var(--mono);font-stretch:87.5%;color:var(--fg2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(145,222,188,.4)} .tag.bad{color:var(--bad);border-color:rgba(239,103,90,.45)}
.tag.live{color:var(--live);border-color:rgba(254,179,84,.45)} .tag.hi{color:var(--fg);border-color:var(--line3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:5px 12px;border-radius:3px;color:var(--fg2);font:450 12.5px var(--sans)}
.btn:hover{color:var(--fg);border-color:var(--line3);background:rgba(255,255,255,.03)}
.btn.pri{background:var(--live);border-color:var(--live);color:#1b1307;font-weight:600} .btn.pri:hover{background:#f4c77c;color:#1b1307}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.012);padding:14px 15px;display:flex;flex-direction:column;gap:9px;min-width:0;cursor:pointer;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line3);background:rgba(255,255,255,.025)}
.card h4{margin:0;display:flex;gap:9px;align-items:center;font:540 15px/1.25 var(--sans);flex-wrap:wrap}
.card{position:relative} .card::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:1px;background:var(--c,transparent)}
.card .id{font:400 10.5px var(--mono);font-stretch:87.5%;color:var(--fg3)}
.card p{margin:0;font-size:13px;color:var(--fg2)}
.chain{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border:1px solid var(--line2);border-radius:2px;font:400 10.5px/19px var(--mono);font-stretch:87.5%;white-space:nowrap;color:var(--fg)}
button.chip:hover{border-color:var(--line3)}
.chip .i{color:var(--fg3)}
.arrow{color:var(--fg3);font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:3px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--fg2))}
.empty{color:var(--fg2);padding:6px 0}
.note{border-left:1px solid var(--line3);padding:2px 0 2px 14px;color:var(--fg2);font-size:13px;max-width:860px}
.note b{color:var(--fg);font-weight:540}
.prose{max-width:820px;display:flex;flex-direction:column;gap:10px}
.prose p{margin:0} .prose ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:4px 0 6px}
.flow > button,.flow > div{border:1px solid var(--line2);border-radius:3px;padding:9px 14px;text-align:left;min-width:150px;background:rgba(255,255,255,.015)}
.flow > button:hover{border-color:var(--line3)}
.flow b{display:block;font:540 14px var(--sans)} .flow span{font:400 10.5px var(--mono);font-stretch:87.5%;color:var(--fg3)}
.flow i{align-self:center;width:28px;height:1px;background:var(--line3);position:relative}
.flow i::after{content:"";position:absolute;right:0;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--line3)}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.kvs div{background:var(--glass2);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.kvs b{font:430 19px/1.2 var(--mono);font-stretch:87.5%;font-variant-numeric:tabular-nums}
.chart{border:1px solid var(--line);border-radius:3px;padding:12px 14px;overflow-x:auto}
.chart svg{display:block}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:3px}
.list > *{display:flex;gap:9px;align-items:baseline;padding:7px 10px;border-top:1px solid var(--line);text-align:left;font-size:13px;width:100%;min-width:0}
.list > :first-child{border-top:0}
.list button:hover{background:rgba(255,255,255,.03)}
.list .r{margin-left:auto;color:var(--fg3);font:400 10.5px var(--mono);font-stretch:87.5%;text-align:right;min-width:0;overflow-wrap:anywhere}

/* dossier */
.dossier{grid-row:1 / 3;grid-column:3;background:var(--glass2);border-left:1px solid var(--line2);overflow:auto;min-width:0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);scrollbar-width:thin}
.app:not(.open) .dossier{visibility:hidden}
.dossier > header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--glass2)}
.dossier > header button{font-size:20px;line-height:1;padding:0 6px;color:var(--fg3)} .dossier > header button:hover{color:var(--fg)}
.dbody{padding:18px;display:flex;flex-direction:column;gap:18px}
.dbody h2{margin:0;font:600 28px/1.05 var(--serif);word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.blk h5{margin:0 0 8px;font:italic 500 15px/1.1 var(--serif);color:#8f897b}
.blk p{margin:0;font-size:13.5px}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--fg3)} .kv dd{margin:0;word-break:break-word}
pre.box{margin:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font:400 11.5px/1.55 var(--mono);font-stretch:87.5%;white-space:pre-wrap;word-break:break-word;max-height:380px;overflow:auto;color:#c8d1d9}
.ladder{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:3px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:8px 10px;border-top:1px solid var(--line);text-align:left;width:100%}
.step:first-child{border-top:0}
.step .n{font:500 11px/20px var(--mono);font-stretch:87.5%;color:var(--c,var(--fg2))}

button.step:hover{background:rgba(255,255,255,.03)}

/* timeline */
.timeline{grid-row:2;grid-column:2 / 4;display:grid;grid-template-columns:118px minmax(0,1fr);border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(6,8,16,.96),rgba(6,8,16,.8));min-width:0}
.app.open .timeline{grid-column:2}
.tl-k{display:flex;flex-direction:column;justify-content:space-between;padding:10px 0 10px 4px}
.tl-k .seg{display:flex;gap:2px}

.tl-k .lanes{display:flex;flex-direction:column;gap:9px;font:400 10px var(--mono);font-stretch:87.5%;color:var(--fg3)}

.tl-tip{position:fixed;z-index:30;pointer-events:none;background:var(--glass2);border:1px solid var(--line2);border-radius:3px;padding:6px 9px;font-size:12px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* notices: what is answering right now, consilium */
.notices{position:fixed;top:14px;left:calc(var(--side) + 12px);right:16px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.app.open ~ .notices{right:calc(var(--dos) + 16px)}
.ntc{pointer-events:auto;width:min(470px,100%);background:var(--glass2);border:1px solid var(--line2);border-radius:4px;padding:11px 14px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.45);cursor:pointer;position:relative;overflow:hidden;animation:ntcIn .35s ease-out}
.ntc.run{border-color:rgba(254,179,84,.5)}
.ntc.run::before{content:"";position:absolute;left:0;top:0;height:1px;width:100%;background:linear-gradient(90deg,transparent,var(--live),transparent);animation:scan 2.4s linear infinite}
.ntc.bad{border-color:rgba(239,103,90,.5)}
@keyframes ntcIn{from{opacity:0;transform:translateY(-8px)}}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.ntc .hd{display:flex;align-items:baseline;gap:10px;padding-right:18px}
.ntc .hd b{font:600 17px/1.15 var(--serif);min-width:0}
.ntc .meta{margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntc .hd .t{margin-left:auto;white-space:nowrap;font:400 11px var(--mono);font-stretch:87.5%;color:var(--fg3);font-variant-numeric:tabular-nums}

.ntc .x:hover{color:var(--fg)}

.ntc.run .sum{color:var(--live)} .ntc.bad .sum{color:var(--bad)}
/* over a section the notices stay one short line each; the full route opens on hover. On the map they are full */
.notices.compact .ntc:not(:hover) .route,.notices.compact .ntc:not(:hover) .council,.notices.compact .ntc:not(:hover) .q{display:none}
.notices:not(.compact) .ntc .sum,.notices.compact .ntc:hover .sum{display:none}

/* route: who answers now */
.route{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.rs{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:9px;align-items:baseline;font-size:12.5px}
.rs .ic{width:7px;height:7px;border-radius:50%;margin-top:2px;align-self:center;background:var(--fg3)}
.rs.run .ic{background:var(--live);animation:ping 1.6s infinite} .rs.ok .ic{background:var(--ok)} .rs.no .ic{background:var(--bad)} .rs.wait .ic{background:transparent;border:1px solid var(--fg3)}

.council{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin-top:9px}
.member{border:1px solid var(--line);border-radius:3px;padding:7px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}

.member .h .s{margin-left:auto;white-space:nowrap;font:400 10px var(--mono);font-stretch:87.5%;color:var(--fg3)}
.member.run .h .s{color:var(--live)} .member.ok .h .s{color:var(--ok)} .member.no .h .s{color:var(--bad)}
.member .m{font:400 10.5px var(--mono);font-stretch:87.5%;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member.chair{grid-column:1 / -1}

/* chat */

.md h2,.md h3{font:600 20px/1.2 var(--serif);margin:16px 0 6px} .md h2{font-size:23px} .md h4{font:580 15px/1.3 var(--sans);margin:14px 0 6px}
.md p{margin:6px 0} .md ul,.md ol{margin:6px 0;padding-left:20px}

.md table{margin:8px 0;font-size:12.5px} .md table td,.md table th{padding:5px 8px;position:static}
.md blockquote{margin:6px 0;border-left:1px solid var(--line3);padding-left:12px;color:var(--fg2)}

.chat-empty b{font:600 26px var(--serif);color:var(--fg)}
.composer{border-top:1px solid var(--line);padding:12px 26px 16px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.18)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{padding:5px 11px;font:450 12.5px var(--sans);color:var(--fg2);border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button.on{background:rgba(254,179,84,.14);color:var(--fg)}
select,input[type=text],textarea{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:3px;padding:5px 8px;color:var(--fg);min-width:0}
select{max-width:260px} select option{background:var(--bg1)}
textarea{width:100%;resize:vertical;min-height:64px;max-height:260px;font:400 14px/1.5 var(--sans);padding:9px 11px}
textarea:focus,select:focus,input:focus{border-color:var(--line3);outline:none}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--fg2);font-size:12.5px;cursor:pointer}
.chk input{accent-color:var(--live)}
.att-list{display:flex;flex-wrap:wrap;gap:6px}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font:400 12px var(--mono);color:var(--fg2)}
.att button{background:none;border:0;color:var(--fg3,var(--fg2));cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.composer.drop{outline:1px dashed var(--live);outline-offset:-6px}
.send-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.send-row .hint{color:var(--fg3);font:400 10.5px var(--mono);font-stretch:87.5%;margin-right:auto}
.chat-side{overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px;min-width:0;scrollbar-width:thin}
.agstep{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:12px;padding:5px 0;border-top:1px solid var(--line)}
.agstep:first-child{border-top:0}
.agstep .t{font:400 10px/18px var(--mono);font-stretch:87.5%;color:var(--fg3)}
.agstep .k{font:400 10px var(--mono);font-stretch:87.5%;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
.agstep.run .k{color:var(--live)} .agstep.err .k{color:var(--bad)}
.agstep .d{color:var(--fg2);word-break:break-word}

/* fallback when WebGL is not available */
.nogl{position:fixed;inset:0;background:radial-gradient(900px 600px at 60% 45%,#0e1424,var(--bg))}

@media (max-width:1180px){:root{--side:228px;--dos:380px}.chat{grid-template-columns:minmax(0,1fr)}.chat-side{display:none}}
@media (prefers-reduced-motion:reduce){.dot.run,.rs.run .ic,.ntc.run::before{animation:none}.ntc{animation:none}}
</style>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => v == null || v === "" || isNaN(v) ? null : Number(v);
const fmtN = v => num(v) == null ? "—" : Math.round(v).toLocaleString("ru-RU");
const fmtTok = v => { v = num(v); if (v == null) return "—"; if (v >= 1e6) return (v/1e6).toFixed(2).replace(".", ",")+" M"; if (v >= 1e4) return (v/1e3).toFixed(1).replace(".", ",")+" K"; return fmtN(v); };
const fmtUsd = v => { v = num(v); if (v == null) return "—"; if (v === 0) return "$0"; return "$" + (v < 0.01 ? v.toFixed(6).replace(/0+$/, "") : v.toFixed(2)); };
const fmtTime = t => t ? new Date(t*1000).toLocaleTimeString("ru-RU") : "—";
const fmtHM = t => t ? new Date(t*1000).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"}) : "—";
// time of day for today, date and time for anything older, so old events never pass for fresh ones
const fmtWhen = t => { if (!t) return "—"; const d = new Date(t*1000), n = new Date();
  return d.toDateString() === n.toDateString() ? d.toLocaleTimeString("ru-RU") : d.toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}).replace(",", ""); };
const fmtDate = t => t ? new Date(t*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const fmtAgo = t => { if (!t) return "—"; const s = Math.max(0, Date.now()/1000 - t);
  if (s < 60) return Math.round(s)+" с назад"; if (s < 3600) return Math.round(s/60)+" мин назад";
  if (s < 86400) return Math.round(s/3600)+" ч назад"; return Math.round(s/86400)+" дн назад"; };
const fmtMs = ms => ms == null ? "идёт…" : ms < 1000 ? ms+" мс" : (ms/1000).toFixed(ms < 10000 ? 1 : 0).replace(".", ",")+" с";
const fmtSec = s => s < 60 ? Math.floor(s)+" с" : Math.floor(s/60)+" мин "+String(Math.floor(s%60)).padStart(2, "0")+" с";
const fmtMB = b => (b/1048576).toFixed(b > 1e9 ? 0 : 1)+" МБ";
const base = p => String(p || "").split(/[\\/]/).pop();
const dirOf = p => String(p || "").replace(/[\\/][^\\/]*$/, "");
const hostOf = u => { try { return new URL(u).host; } catch (e) { return u || ""; } };
const histTs = s => { if (typeof s === "number") return s > 1e11 ? s/1000 : s; const d = new Date(String(s || "").replace(" ", "T")); return isNaN(d) ? null : d.getTime()/1000; };
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
function hexA(h, a){ const n = parseInt(h.slice(1), 16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }
const nowS = () => Date.now()/1000;
const store = {get(k, d){ try { const v = localStorage.getItem("ce3-"+k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("ce3-"+k, JSON.stringify(v)); } catch (e) {} }};

// ---------- model families. "about" is general reference text, not read from this computer; it is labelled as such on screen.
const FAM = {
  deepseek:{n:"DeepSeek", c:"#80bdfb", rx:/deepseek/i, vendor:"DeepSeek, Китай",
    about:"Модели DeepSeek сильны в программировании и пошаговых рассуждениях и стоят дёшево за токен. Pro в названии обычно означает старшую модель, Flash: быструю и дешёвую."},
  glm:{n:"GLM", c:"#6cd5b3", rx:/glm|zhipu|chatglm/i, vendor:"Zhipu AI (Z.ai), Китай",
    about:"Семейство GLM: универсальные модели для кода, анализа и работы с инструментами."},
  minimax:{n:"MiniMax", c:"#ea91bc", rx:/minimax|abab/i, vendor:"MiniMax, Китай",
    about:"Модели MiniMax известны очень длинным контекстом: подходят для больших документов, кодовых баз и архитектурных обзоров."},
  kimi:{n:"Kimi", c:"#ddd674", rx:/kimi|moonshot/i, vendor:"Moonshot AI, Китай",

  qwen:{n:"Qwen", c:"#efaf6f", rx:/qwen|qwq/i, vendor:"Alibaba Cloud, Китай",
    about:"Большое семейство Qwen. Flash-версии отвечают быстро и стоят дёшево, удобны для черновой генерации кода."},
  claude:{n:"Claude", c:"#eb8f72", rx:/claude|sonnet|opus|haiku|anthropic/i, vendor:"Anthropic, США",
    about:"Claude: сильная модель для кода и длинных задач. Работает через Claude Code CLI на компьютере или через API."},
  gemini:{n:"Gemini", c:"#aaa7f4", rx:/gemini/i, vendor:"Google",
    about:"Gemini: семейство моделей Google; на нём работает и Antigravity. Отдельный пул gemini ходит в официальный Gemini API по своему ключу."},
  llama:{n:"Llama", c:"#c595db", rx:/llama/i, vendor:"Meta, открытые веса",
    about:"Открытая модель Llama. Часто запускается у Groq: очень быстрые ответы и бесплатный лимит."},
  grok:{n:"Grok", c:"#e4e1da", rx:/grok|x-?ai/i, vendor:"xAI, США",
    about:"Grok: модели xAI с доступом к свежим данным и сильными рассуждениями. Пул grok ходит через шлюз-перепродавца по своему ключу."},
  gpt:{n:"GPT", c:"#a8c3d0", rx:/gpt|openai|\bo[134]\b/i, vendor:"OpenAI или совместимые",
    about:"Модели семейства GPT или совместимые с API OpenAI."},
  other:{n:"Другие", c:"#89939e", rx:/$^/, vendor:"—", about:"Модель не удалось отнести к известному семейству по названию."},
};
const FAM_ORDER = ["deepseek","glm","minimax","kimi","qwen","claude","gemini","llama","grok","gpt","other"];
const ALWAYS = ["deepseek","glm","minimax","kimi"];
const famOf = s => { s = String(s || ""); for (const k of FAM_ORDER) if (FAM[k].rx.test(s)) return k; return "other"; };
const CLIENT = {antigravity:{n:"Antigravity"}, "claude-code":{n:"Claude Code"}, "council-engine":{n:"Чат Council Engine"}};
const clientName = c => CLIENT[c]?.n || c || "—";

const VIEWS = [
  ["sys","Система","Живая карта: ядро, роли, пулы моделей и каждый вызов"],
  ["chat","Чат","Задача роли, модели или консилиуму, с папкой проекта"],
  ["ag","Antigravity","Шаги Antigravity из его локальных файлов"],
  ["roles","Роли","Кто за что отвечает и на каких моделях"],
  ["models","Модели","Пулы, ключи и семейства"],
  ["tokens","Токены","Расход и балансы из учёта моста"],
  ["log","Журнал","Каждый вызов моста"],
  ["proc","Процессы","Что запущено на компьютере"],
  ["cfg","Настройки","Откуда приложение берёт данные"],
  ["how","Справка","Как это устроено и чего приложение не видит"]];
let view = "sys", CFG = null, ST = null, SYS = null, AG = null, PROJ = null, failed = false, selRef = null;

function stepState(r, c, isLast){
  if (r.skipped) return "skip";
  if (r.ok === true) return "ok";
  if (r.ok === false) return "no";
  if (isRun(c)) return "run";

  }
  const show = compact ? steps.filter((r, i) => r.ok === false || i === steps.length - 1) : steps;

    const i = steps.indexOf(r), st = stepState(r, c, i === steps.length - 1), p = SYS.prov[r.provider], k = p ? p.fam : famOf(r.model || r.provider);
    const model = r.model || p?.model || r.provider;

    return `<div class="rs ${st}"><span class="ic"></span><span>${sw(k)} <b>${esc(FAM[k].n)}</b> <span class="m">${esc(model)} · пул ${esc(r.provider)}${r.agent && !c.consilium ? " · роль "+esc(roleName(r.agent)) : ""}</span></span>${s}</div>`;
  }).join("")}</div>`;
}
function memberState(c, id){
  // in round 2 a member is called again: its state is that of the current round
  const C = c.council || {}, all = (c.route || []).filter(r => r.agent === id), r2 = C.round === 2 && C.round2_ts && id !== C.chair;
  const cur = r2 ? all.filter(r => r.ts >= C.round2_ts) : all, steps = cur.length ? cur : all, last = steps[steps.length - 1];
  if (c.failed_agents?.[id]) return {st:"no", steps, last, text:"не ответил"};
  if (last?.ok === true) return {st:"ok", steps, last, text:(r2 && cur.length ? "уточнил ответ" : "ответил") + (last.s != null ? " за "+String(last.s).replace(".", ",")+" с" : "")};
  if (last && last.ok == null && isRun(c)) return {st:"run", steps, last, text:r2 && cur.length ? "критикует других" : "думает"};
  if (!last) return {st:isRun(c) ? "wait" : "no", steps, last, text:isRun(c) ? "ждёт" : "не запускался"};
  if (last.ok === false && isRun(c)) return {st:"run", steps, last, text:"переходит к запасному"};
  return {st:c.error ? "no" : "ok", steps, last, text:c.error ? "не ответил" : "ответил"};
}

    const st = members.map(id => memberState(c, id).st), n = k => st.filter(x => x === k).length;
    const parts = [n("ok") && "ответили " + n("ok"), n("run") && "думают " + n("run"), n("wait") && "ждут " + n("wait"), n("no") && "не ответили " + n("no")].filter(Boolean);

function md(src){

  const isRow = l => /^\s*\|.*\|\s*$/.test(l), isItem = l => /^\s*([-*]|\d+\.)\s+/.test(l);
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue; }
    if (isRow(l)) { const rows = []; while (i < lines.length && isRow(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()), body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<div style="overflow-x:auto"><table>${body.map((r, k) => `<tr>${cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { const lv = Math.min(4, Math.max(2, m[1].length)); out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue; }
    if (isItem(l)) { const ord = /^\s*\d+\./.test(l), items = []; while (i < lines.length && isItem(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${ord ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ord ? "ol" : "ul"}>`); continue; }
    if (/^>\s?/.test(l)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [lines[i++]]; while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|>)/.test(lines[i]) && !isRow(lines[i]) && !isItem(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join("\n")).replace(/\n/g, "<br>")}</p>`);
  }
  return out.join("");
}

function tokenChart(){
  const h = SYS.history.filter(e => num(e.total_tokens) != null);
  if (!h.length) return `<div class="empty">История запросов пуста.</div>`;
  const max = Math.max(...h.map(e => num(e.total_tokens))), bw = 22, gap = 6, ch = 150, w = h.length*(bw+gap) + 60;
  const ticks = [0, 0.5, 1].map(f => Math.round(max*f));
  return `<div class="chart"><svg width="${w}" height="${ch+46}" role="img" aria-label="Токены по запросам">
    ${ticks.map(t => { const y = 8 + ch - (t/max)*ch; return `<line x1="50" x2="${w}" y1="${y}" y2="${y}" stroke="rgba(167,179,189,.1)"/><text x="44" y="${y+4}" fill="#a7b3bd" font-size="10" text-anchor="end" font-family="Martian Mono Variable, monospace" font-stretch="87.5%">${fmtTok(t)}</text>`; }).join("")}
    ${h.map((e, i) => { const v = num(e.total_tokens), bh = Math.max(2, v/max*ch), x = 56 + i*(bw+gap), y = 8 + ch - bh, c = FAM[e.fam].c;
      const pr = num(e.prompt_tokens) || 0, ph = v ? pr/v*bh : 0;
      return `<g><title>${esc(e.timestamp)} · ${esc(e.provider)} · ${esc(e.model)}\nвход ${fmtN(e.prompt_tokens)} · выход ${fmtN(e.completion_tokens)} · всего ${fmtN(v)} · ${fmtUsd(e.cost)}</title>
        <rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${hexA(c,.85)}"/><rect x="${x}" y="${y+bh-ph}" width="${bw}" height="${ph}" fill="${hexA(c,.35)}"/>
        <text x="${x+bw/2}" y="${ch+24}" fill="#a7b3bd" font-size="9" text-anchor="middle" font-family="Martian Mono Variable, monospace" font-stretch="87.5%">${esc(String(e.timestamp || "").slice(11, 16))}</text>
        <text x="${x+bw/2}" y="${ch+36}" fill="#6b7680" font-size="8" text-anchor="middle" font-family="Martian Mono Variable, monospace" font-stretch="87.5%">${esc(String(e.timestamp || "").slice(8, 10)+"."+String(e.timestamp || "").slice(5, 7))}</text></g>`; }).join("")}
  </svg><div class="faint" style="font-size:12px;margin-top:4px">Каждый столбик: один ответ модели. Светлая часть: токены ответа, тёмная: токены запроса. Наведи, чтобы увидеть пул и модель.</div></div>`;
}

    ${credits.map(r => `<div class="card" style="--c:${FAM[r.fam].c}" data-open="pool:${esc(r.key)}"><h4>${esc(r.key)}</h4><div class="id">credit из последнего ответа API: ${esc(r.credit)}</div><p>Это значение провайдер прислал в поле usage. Что именно оно означает, знает только провайдер.</p></div>`).join("")}</div>`;
}

function viewProc(){

    <h3 class="sec">Чат</h3>
    <ul>
      <li>Чат запускает тот же мост, что и Antigravity, через журнал вызовов. Поэтому каждый вопрос из чата виден на карте, в журнале и в учёте токенов, с пометкой «Чат Council Engine».</li>
      <li>Режимы: роль (agent_run), конкретная модель (model_ask), консилиум (consilium), Claude Code (claude_ask: Claude CLI сам читает файлы проекта). Запрос уходит только по кнопке «Отправить» и тратит токены выбранных пулов.</li>
      <li>«Учитывать предыдущие ответы» добавляет к запросу два последних вопроса и ответа из чата: модели сами по себе разговор не помнят.</li>

    <ul>
      <li>Шаги Antigravity приложение читает из его файлов <code>.gemini\\antigravity\\brain\\…\\transcript.jsonl</code>: тип шага, статус, время и краткое описание действия, которое пишет сам Antigravity.</li>
      <li>Модель, выбранную в Antigravity, его файлы хранят только внутренним кодом (например MODEL_PLACEHOLDER_M26), без названия. Приложение показывает этот код как есть.</li>
      <li>Написать сообщение прямо в окно Antigravity нельзя: у Antigravity нет для этого команды или входа. Можно открыть проект в Antigravity и скопировать туда текст задачи.</li>
      <li>Свою квоту Antigravity хранит не в файлах, поэтому остаток его лимитов приложение не видит.</li>
    </ul>
    <h3 class="sec">Что показывает приложение и чего не видит</h3>
    <ul>
      <li>Всё на экранах собрано с этого компьютера. Приложение слушает только адрес 127.0.0.1 и не отправляет ничего в интернет само; запросы к моделям уходят только из чата и только через мост.</li>
      <li>Доступность пула видна после реального вызова: ошибки и переходы на запасной пул видны в журнале и на карте красной вспышкой.</li>
      <li>Токены запросов через Claude Code CLI не попадают в учёт: CLI не отдаёт мосту счётчик токенов.</li>

    </ul>

      <li><code>python council_app.py --status</code>: текстовая сводка в консоли.</li>
      <li><code>python council_app.py --wire</code> / <code>--unwire</code>: подключить или убрать журнал (с резервными копиями настроек).</li>
      <li><code>python C:\\projects\\tools\\claude_bridge.py --check</code>: один короткий запрос к каждому пулу с ключом.</li>
    </ul></div>`;

      const star = new THREE.Mesh(new THREE.SphereGeometry(0.7, 24, 16), new THREE.MeshStandardMaterial({color:0xe9b660, emissive:0xe9b660, emissiveIntensity:0.5, transparent:true}));
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.09, 8, 64), new THREE.MeshStandardMaterial({color:0xd8c9a8, metalness:.4, roughness:.3, transparent:true}));
      ring.rotation.set(1.25, 0, -0.32); mark.add(star, ring); mark.userData.parts = [star.material, ring.material];
    }
    // a drop line to the plane and a small ring at its foot show how high above the plane the client sits
    const hex = new THREE.Group(), y0 = -CPOS[c.key][1] - 1.5;
    const drop = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -2.2, 0), new THREE.Vector3(0, y0, 0)]), new THREE.LineDashedMaterial({color:0xd8c9a8, dashSize:.5, gapSize:.7, transparent:true, opacity:.25}));
    drop.computeLineDistances();
    const foot = orbitLine(1.6, .3); foot.position.y = y0;
    hex.add(drop, foot); hex.material = drop.material; foot.material = drop.material;
    const glow = new THREE.Sprite(spriteMat(TEX_GLOW, LIVE.clone(), 0)); glow.scale.setScalar(10);
    holder.add(mark); g.add(holder, hex, glow);
    const lb = label("client", c.name, ""); lb.position.set(0, -2.4, 0); g.add(lb);
    scene.add(g); addHit(g, "client:" + c.key, 3);
    const pts = [new THREE.Vector3(), new THREE.Vector3()];
    const link = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({color:0xd8c9a8, dashSize:1, gapSize:1.2, transparent:true, opacity:.25}));
    scene.add(link); g.userData.link = link;
    NODES.set("client:" + c.key, {type:"client", id:c.key, obj:g, mark, holder, edge:hex, glow, label:lb, link, phase:c.key.length, spin:0});
  });
  // links role > pools: one buffer for all, updated every frame as the orbits turn
  LINKS.length = 0;
  m.roles.forEach(r => r.chain.forEach((pid, i) => { if (NODES.has("pool:" + pid)) LINKS.push({role:"role:" + r.id, pool:"pool:" + pid, primary:i === 0}); }));
  const n = LINKS.length + m.roles.length;
  linkGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n*6), 3));
  linkGeo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(n*8), 4));
  linkGeo.setDrawRange(0, n*2);
}
const LINKS = [];
const linkGeo = new THREE.BufferGeometry();
const linkMat = new THREE.LineBasicMaterial({vertexColors:true, transparent:true, depthWrite:false});
const links = new THREE.LineSegments(linkGeo, linkMat); links.frustumCulled = false; scene.add(links);

// ---- constellation: while a consilium runs, its members are joined into a figure, a star at each member
const CONST_N = 24, constGeo = new THREE.BufferGeometry();
constGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(CONST_N*3), 3));
const constLine = new THREE.LineLoop(constGeo, new THREE.LineBasicMaterial({color:0xe9b660, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending}));
constLine.frustumCulled = false; scene.add(constLine);
const constStars = Array.from({length:CONST_N}, () => { const s = new THREE.Sprite(spriteMat(TEX_CROSS, 0xf3d29a, 0)); s.scale.setScalar(4.2); scene.add(s); return s; });

// ---- comets: one light per running leg, with a short trail
const COMETS = new Map();
function comet(){ const g = new THREE.Group(), parts = [];
  for (let i = 0; i < 9; i++) { const s = new THREE.Sprite(spriteMat(TEX_GLOW, LIVE.clone(), i === 0 ? 1 : 0.5*(1 - i/9))); s.scale.setScalar(i === 0 ? 2.6 : 1.8*(1 - i/12)); g.add(s); parts.push(s); }
  scene.add(g); return {g, parts, t:Math.random()}; }
const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(), new THREE.Vector3()]);
// ---- pulses: expanding rings for answers, failures and finished calls
const PULSES = [], SEEN = new Set();
function pulse(pos, color, size = 7){ const s = new THREE.Sprite(spriteMat(TEX_RING, color, .9)); s.position.copy(pos); s.scale.setScalar(1); scene.add(s); PULSES.push({s, t:0, size}); }

// a family is a group at the centre; its anchor (the name on the belt) is where the camera should look
const wpos = (ref, out) => { const n = NODES.get(ref); return n ? (n.anchor || n.obj).getWorldPosition(out) : out.set(0, 0, 0); };

// ---- sync from the app (every 2 s)
let selected = null, hovered = null, viewName = "sys", flying = null;
window.SCENE = {
  sync(m){
    const sig = JSON.stringify([m.core.tools, m.roles.map(r => [r.id, r.color, r.council, r.chair, r.chain]), m.pools.map(p => [p.id, p.fam, p.key]), m.fams.map(f => f.key), m.clients.map(c => c.key)]);
    if (sig !== SIG) { build(m); SIG = sig; }
    M = m;
    setLabel(coreLabel, m.core.name, m.core.tools.length + " инструментов");
    m.roles.forEach(r => { const n = NODES.get("role:" + r.id); if (n) { n.calls = r.calls; n.obj.scale.setScalar(0.9 + Math.min(1.2, Math.log10(1 + r.calls)*0.45)); } });
    m.pools.forEach(p => { const n = NODES.get("pool:" + p.id); if (!n) return; n.obj.scale.setScalar(0.85 + Math.min(0.6, Math.log10(1 + p.tokens)*0.12));
      n.paused = !!p.pause; setLabel(n.label, p.id, p.pause || p.model); n.label.userData.el.lastChild.className = p.pause ? "pz" : ""; });
    m.fams.forEach(f => { const n = NODES.get("fam:" + f.key); if (n) setLabel(n.label, f.name, f.sub); });
    m.clients.forEach(c => { const n = NODES.get("client:" + c.key); if (!n) return; n.alive = c.alive; n.active = c.active;
      setLabel(n.label, c.name, c.active ? "работает" : c.alive ? "запущен" : "не запущен"); n.label.userData.el.lastChild.className = c.active ? "st" : ""; });
    NODES.forEach(n => { if (n.type === "tool") n.state = m.core.toolState[n.id] || null; });
    // comets for running legs
    const want = new Set();
    m.live.forEach(c => c.legs.forEach((l, i) => { const k = c.id + ":" + i + ":" + (l.role || "") + ":" + (l.pool || ""); want.add(k);
      if (!COMETS.has(k)) COMETS.set(k, {...comet(), call:c, leg:l}); else COMETS.get(k).call = c; }));
    COMETS.forEach((v, k) => { if (!want.has(k)) { scene.remove(v.g); v.g.traverse(x => x.material?.dispose()); COMETS.delete(k); } });
    // pulses for events that have not been shown yet
    m.events.forEach(e => { if (SEEN.has(e.key)) return; SEEN.add(e.key);
      if (e.kind === "fail" && e.pool) { const n = NODES.get("pool:" + e.pool); if (n) { n.fail = 1; pulse(wpos("pool:" + e.pool, new THREE.Vector3()), BAD.clone(), 9); } }
      else if (e.kind === "ok" && e.pool) { const n = NODES.get("pool:" + e.pool); if (n) { n.heat = 1; pulse(wpos("pool:" + e.pool, new THREE.Vector3()), n.base.clone(), 7); } }
      else if (e.kind === "end") pulse(new THREE.Vector3(), new THREE.Color(0xffd9a0), 14);
      else if (e.kind === "fail") pulse(new THREE.Vector3(), BAD.clone(), 14); });
    if (SEEN.size > 2000) SEEN.clear();
    if (m.selected !== selected) { selected = m.selected; focusOn(selected); }
    if (m.view !== viewName) { viewName = m.view; document.getElementById("labels").classList.toggle("off", viewName !== "sys"); bloom.strength = viewName === "sys" ? 0.62 : 0.4; }
    recolorLinks();
  }
};

// ---- selection: highlight the node and its links, fly the camera to it
function related(ref){
  const s = new Set([ref]); if (!ref || !M) return s;
  const [k, id] = [ref.split(":")[0], ref.split(":").slice(1).join(":")];
  if (k === "role") { const r = M.roles.find(x => x.id === id); r?.chain.forEach(p => s.add("pool:" + p)); }
  if (k === "pool") M.roles.forEach(r => { if (r.chain.includes(id)) s.add("role:" + r.id); });
  if (k === "fam") M.pools.filter(p => p.fam === id).forEach(p => { s.add("pool:" + p.id); M.roles.forEach(r => { if (r.chain.includes(p.id)) s.add("role:" + r.id); }); });
  return s;
}
function recolorLinks(){
  const col = linkGeo.getAttribute("color"); if (!col || !M) return;
  const focus = hovered || selected, rel = focus ? related(focus) : null, c = new THREE.Color();
  LINKS.forEach((l, i) => {
    const on = rel && (rel.has(l.role) && rel.has(l.pool)) && (focus === l.role || focus === l.pool || focus.startsWith("fam:"));
    const base = NODES.get(l.pool)?.base || STEEL;
    c.copy(l.primary ? base : STEEL);
    const a = rel ? (on ? (l.primary ? .95 : .5) : .025) : (l.primary ? .1 : .03);
    col.setXYZW(i*2, c.r, c.g, c.b, a); col.setXYZW(i*2 + 1, c.r, c.g, c.b, a);
  });
  M.roles.forEach((r, j) => { const i = LINKS.length + j, a = rel ? (rel.has("role:" + r.id) ? .25 : .02) : .05;
    col.setXYZW(i*2, .85, .79, .66, a); col.setXYZW(i*2 + 1, .85, .79, .66, a); });
  col.needsUpdate = true;
  NODES.forEach((n, ref) => { const el = n.label?.userData.el; if (!el) return;
    el.classList.toggle("dim", !!rel && !rel.has(ref) && n.type !== "fam" && n.type !== "client");
    el.classList.toggle("sel", ref === focus); el.classList.toggle("near", !!rel && rel.has(ref)); });
}
function focusOn(ref){
  const n = ref && NODES.get(ref === "core" ? "" : ref);
  if (ref === "core") flying = {target:new THREE.Vector3(0, 0, 0), dist:34, follow:null};
  else if (n && n.type !== "tool") flying = {target:null, dist:n.type === "fam" ? 46 : n.type === "client" ? 40 : 30, follow:ref};
  else if (!ref) flying = {target:new THREE.Vector3(0, 0, 0), dist:HOME.length(), follow:null, home:true};
  NODES.forEach(x => { if (x.type === "tool") x.label.visible = ref === "core"; });
  recolorLinks();
}

// ---- pointer: hover and click on nodes
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
function pick(e){
  const r = canvas.getBoundingClientRect(); ptr.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1);
  ray.setFromCamera(ptr, camera); const hit = ray.intersectObjects([coreHit, ...HITS], false)[0];
  return hit ? hit.object.userData.ref : null;
}
canvas.addEventListener("pointermove", e => { const ref = pick(e); if (ref !== hovered) { hovered = ref; canvas.style.cursor = ref ? "pointer" : "grab"; recolorLinks(); } });
canvas.addEventListener("pointerleave", () => { hovered = null; recolorLinks(); });
canvas.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return; down = null;
  const ref = pick(e); if (ref) CE.open(ref); else if (selected && viewName === "sys") CE.clear();
});

// ---- layout: keep the system centred in the free space between the side column and the dossier
function resize(){
  const w = innerWidth, h = innerHeight, side = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--side")) || 268;
  const dos = document.getElementById("app").classList.contains("open") ? (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dos")) || 440) : 0;
  renderer.setSize(w, h, false); composer.setSize(w, h); labels.setSize(w, h);
  camera.aspect = w/h; camera.setViewOffset(w, h, -(side - dos)/2, 30, w, h); camera.updateProjectionMatrix();
  // wide screens come a little closer, narrow ones back off, so the belt of pools spans the free width
  HOME.copy(HOME0).multiplyScalar(Math.max(0.86, Math.min(1.6, 1.37/Math.max(0.5, (w - side - dos)/h))));
}
addEventListener("resize", resize);
new MutationObserver(resize).observe(document.getElementById("app"), {attributes:true, attributeFilter:["class"]});
resize();

// ---- labels: keep the most important ones readable, hide the ones they would overlap and the ones under panels
const PRI = {core:100, client:80, fam:70, role:40, pool:30, tool:20};
function declutter(){
  const focus = hovered || selected, rel = focus ? related(focus) : null, items = [];
  items.push({el:coreLabel.userData.el, p:150});
  NODES.forEach((n, ref) => { const el = n.label?.userData.el; if (!el || !n.label.visible) return;
    if (n.quiet) { el.classList.remove("hid"); return; }
    let p = PRI[n.type] || 10;
    if (ref === focus) p = 300; else if (rel?.has(ref)) p += 60; else if (rel && n.type !== "fam" && n.type !== "client") p -= 100;
    if ((n.heat || 0) > 0.6 || n.active) p += 90;
    items.push({el, p}); });
  items.sort((a, b) => b.p - a.p);
  const taken = [...document.querySelectorAll(".side, #caption, #timeline, #dossier, #banners > *, #crumb, #notices > *")]
    .map(e => e.getBoundingClientRect()).filter(r => r.width > 0 && r.height > 0);
  const hit = r => taken.some(t => r.left < t.right + 4 && r.right > t.left - 4 && r.top < t.bottom + 2 && r.bottom > t.top - 2);
  items.forEach(({el}) => { const r = el.getBoundingClientRect(); if (!r.width) return;
    const clash = hit(r); el.classList.toggle("hid", clash); if (!clash) taken.push(r); });
}

// ---- frame loop
const clock = new THREE.Clock();
let intro = reduce ? 1 : 0, frame = 0;
function tick(){
  requestAnimationFrame(tick);
  if (document.hidden) return;
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  frame++;
  if (viewName !== "sys" && frame % 2) return;  // behind a panel the map runs at half rate
  if (!reduce) {
    roleSpin.rotation.y += dt*0.035; poolSpin.rotation.y += dt*0.012; dust.rotation.y += dt*0.004;
    shell1.rotation.y += dt*0.07; shell2.rotation.y -= dt*0.045; rays.rotation.z += dt*0.02; toolRing.rotation.y -= dt*0.05;
  }
  // camera: intro fly-in, then focus flights, then gentle auto-orbit when idle
  if (intro < 1) { intro = Math.min(1, intro + dt/2.8); const e = 1 - Math.pow(1 - intro, 3);
    camera.position.lerpVectors(new THREE.Vector3(0, 150, 330), HOME, e); }
  if (flying) {
    const target = flying.follow ? wpos(flying.follow, tmpW) : flying.target;
    controls.target.lerp(target, 0.08);
    const dir = tmpV.copy(camera.position).sub(controls.target), d = dir.length(), want = flying.dist;
    dir.setLength(d + (want - d)*0.06); camera.position.copy(controls.target).add(dir);
    if (flying.home && Math.abs(d - want) < 0.5 && controls.target.length() < 0.3) flying = null;
  }
  if (!reduce && !controls.autoRotate && performance.now() - lastInput > 14000 && !selected) controls.autoRotate = true;
  controls.update();
  // core breathes faster while the bridge works
  const busy = M && M.live.length > 0;
  const k = busy ? 0.5 + 0.5*Math.sin(t*5) : 0.5 + 0.5*Math.sin(t*1.2);
  coreGlow.material.opacity = (busy ? .52 : .42) + k*.1; coreGlow.scale.setScalar(busy ? 22 + k*3 : 18 + k*1.5);
  corona.material.opacity = (busy ? .24 : .2) + k*.04; corona.scale.setScalar(busy ? 46 + k*4 : 40 + k*2);
  SUN_U.t.value = t; SUN_U.busy.value += ((busy ? 1 : 0) - SUN_U.busy.value)*Math.min(1, dt*2);
  rays.material.opacity = busy ? .42 + k*.12 : .3;
  raysHolder.lookAt(camera.position);
  // names of roles and pools stay off the map unless the node is in focus, at work, paused, or the camera is close
  const focus = hovered || selected, rel = focus ? related(focus) : null, close = camera.position.distanceTo(controls.target) < 62;
  // nodes
  NODES.forEach((n, ref) => {
    if (n.type === "tool") {
      if (n.state === "run") n.mesh.material.color.copy(LIVE);
      else if (n.state === "fail") n.mesh.material.color.copy(BAD);
      else if (n.state === "flash") n.mesh.material.color.setHex(0xeaeff3);
      else n.mesh.material.color.setHex(0x6b7680);
    }
    if (n.type === "role") {
      const working = M?.live.some(c => c.legs.some(l => l.role === n.id));
      n.heat = Math.max(working ? 1 : 0, n.heat - dt*0.5);
      n.glow.material.opacity = n.heat*(0.28 + 0.1*Math.sin(t*6));
      n.mesh.material.color.copy(n.base).lerp(LIVE, working ? 0.35 : 0);
      n.obj.rotation.y += dt*0.6;
    }
    if (n.type === "pool") {
      const working = M?.live.some(c => c.legs.some(l => l.pool === n.id));
      n.heat = Math.max(working ? 1 : 0, n.heat - dt*0.4); n.fail = Math.max(0, n.fail - dt*0.35);
      n.glow.material.color.copy(n.fail > 0.02 ? BAD : working ? LIVE : n.base);
      n.glow.material.opacity = (n.key ? 0.04 : 0) + n.heat*0.5 + n.fail*0.6;
      n.atm.material.uniforms.c.value.copy(n.fail > 0.02 ? BAD : n.base).lerp(LIVE, n.fail > 0.02 ? 0 : n.heat*0.5);
      n.atm.material.uniforms.k.value = (n.key ? 0.85 : 0.3) + n.heat*0.9 + n.fail*0.9;
      if (n.key) n.mesh.material.color.copy(n.base).lerp(BAD, n.fail*0.8);
      if (n.holder) {
        // the mark turns to the viewer and sways so its depth shows; while the model answers it spins and glows
        n.spin = working ? n.spin + dt*3.2 : n.spin*Math.pow(0.04, dt);
        n.holder.lookAt(camera.position); n.holder.rotateY((reduce ? 0 : Math.sin(t*0.55 + n.phase)*0.5) + n.spin);
        if (n.key) { n.mesh.material.emissive.copy(n.fail > 0.02 ? BAD : n.base); n.mesh.material.emissiveIntensity = 0.1 + n.heat*0.6 + n.fail*0.6; }
      }
    }
    if (n.type === "client") {
      n.glow.material.opacity = n.active ? 0.35 + 0.2*Math.sin(t*4) : 0;
      n.edge.material.opacity = n.active ? 0.6 : n.alive ? 0.3 : 0.1;
      // a client that is not running is a faint ghost of its mark
      (n.mark.userData.parts || [n.mark.material]).forEach(m => { m.opacity = n.alive ? 1 : 0.28; m.transparent = !n.alive; m.depthWrite = !!n.alive;
        if (m.emissive) m.emissiveIntensity = n.active ? 0.55 + 0.25*Math.sin(t*4) : n.alive ? 0.2 : 0.05; });
      n.spin = n.active ? n.spin + dt*2.4 : n.spin*Math.pow(0.04, dt);
      n.holder.lookAt(camera.position); n.holder.rotateY((reduce ? 0 : Math.sin(t*0.45 + n.phase)*0.4) + n.spin);
      const p = n.link.geometry.getAttribute("position"); n.obj.getWorldPosition(tmpV);
      p.setXYZ(0, tmpV.x, tmpV.y, tmpV.z); p.setXYZ(1, 0, 0, 0); p.needsUpdate = true; n.link.computeLineDistances();
      n.link.material.opacity = n.active ? 0.6 : n.alive ? 0.3 : 0.1; n.link.material.color.copy(n.active ? LIVE : STEEL);
    }
    if (n.label && n.type !== "fam" && n.type !== "tool") {
      n.obj.getWorldPosition(tmpV); const d = camera.position.distanceTo(tmpV);
      let o = ref === selected || ref === hovered ? 1 : Math.max(0.3, Math.min(1, (190 - d)/90));
      n.quiet = (n.type === "role" || n.type === "pool") && !(ref === focus || rel?.has(ref) || (n.heat || 0) > 0.6 || close || n.paused);
      if (n.quiet) o = 0;
      n.label.userData.el.style.opacity = o;
      n.label.userData.el.classList.toggle("hot", n.type !== "client" && (n.heat || 0) > 0.6);
    }
  });
  // link buffer positions follow the orbits
  const pos = linkGeo.getAttribute("position");
  if (pos && M) {
    LINKS.forEach((l, i) => { wpos(l.role, tmpV); wpos(l.pool, tmpW); pos.setXYZ(i*2, tmpV.x, tmpV.y, tmpV.z); pos.setXYZ(i*2 + 1, tmpW.x, tmpW.y, tmpW.z); });
    M.roles.forEach((r, j) => { const i = LINKS.length + j; wpos("role:" + r.id, tmpV); pos.setXYZ(i*2, 0, 0, 0); pos.setXYZ(i*2 + 1, tmpV.x, tmpV.y, tmpV.z); });
    pos.needsUpdate = true;
  }
  // constellation of the running consilium
  const council = M?.live.find(c => c.consilium && c.members?.length > 1);
  const cpos = constGeo.getAttribute("position"), members = council ? council.members.filter(id => NODES.has("role:" + id)).slice(0, CONST_N) : [];
  members.forEach((id, i) => { wpos("role:" + id, tmpV); cpos.setXYZ(i, tmpV.x, tmpV.y, tmpV.z); constStars[i].position.copy(tmpV); });
  cpos.needsUpdate = true; constGeo.setDrawRange(0, members.length);
  const cf = members.length > 1 ? 0.7 + 0.2*Math.sin(t*2.2) : 0;
  constLine.material.opacity += (cf - constLine.material.opacity)*Math.min(1, dt*3);
  constStars.forEach((sp, i) => { sp.material.opacity = i < members.length ? constLine.material.opacity*1.3 : 0; sp.material.rotation = t*0.3 + i; });
  // comets travel client > core > role > pool and loop while the call runs
  COMETS.forEach(v => {
    const pts = [wpos("client:" + v.call.client, new THREE.Vector3()), new THREE.Vector3(0, 0, 0)];
    if (v.leg.role && NODES.has("role:" + v.leg.role)) pts.push(wpos("role:" + v.leg.role, new THREE.Vector3()));
    if (v.leg.pool && NODES.has("pool:" + v.leg.pool)) pts.push(wpos("pool:" + v.leg.pool, new THREE.Vector3()));
    curve.points = pts; v.t = reduce ? 0.98 : (v.t + dt/(1.2 + pts.length*0.45)) % 1;
    v.parts.forEach((s, i) => { const u = Math.max(0, v.t - i*0.018); curve.getPointAt(u, s.position); s.visible = !reduce || i === 0; });
  });
  for (let i = PULSES.length - 1; i >= 0; i--) { const p = PULSES[i]; p.t += dt/1.3;
    if (p.t >= 1) { scene.remove(p.s); p.s.material.dispose(); PULSES.splice(i, 1); continue; }
    p.s.scale.setScalar(1 + p.size*p.t); p.s.material.opacity = 0.9*(1 - p.t); }
  composer.render(dt);
  labels.render(scene, camera);
  if (viewName === "sys" && frame % 8 === 0) { document.getElementById("labels").classList.toggle("close", camera.position.distanceTo(controls.target) < 62); declutter(); }
}
tick();
CE.ready();
</script>
